*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC",sans-serif;max-width:720px;margin:0 auto;padding:12px 14px 40px}

<div id="app"></div>
<script>
const Q=[
{c:'生合成',q:'罌粟（Papaver somniferum）蒴果中 morphine 含量最高的採收時期為何？',o:['開花初期','開花後 2～3 週','果實完全成熟乾裂後','種子發芽期'],a:1,e:[
'太早採收時，生物鹼組成以 codeine、thebaine 為主，morphine 尚未累積。',
'開花後 2～3 週的未成熟蒴果，morphine 達最高點（morphine 為最終代謝產物），此時割取乳汁製阿片。',
'太晚時 morphine 會降解，含量下降。',
'種子發芽期不是採收阿片的時期，且罌粟子本身不含生物鹼。']},
{c:'生合成',q:'下列何者為 Quinine 生合成之前驅物？',o:['Tyrosine＋Phenylalanine','Ornithine＋Phenylalanine','Tryptophan＋Secologanin（單萜）','Lysine＋Acetate'],a:2,e:[
'Tyrosine＋Phenylalanine 是 Isoquinoline 類（如 morphine、berberine）的原料。',
'Ornithine＋Phenylalanine 是 Tropane 類（hyoscyamine）的原料。',
'Quinoline（quinine）與 Indole 類同為 Tryptophan＋單萜 Secologanin，經分子重排、再環化而成 quinoline 環。',
'Lysine 衍生 Piperidine 類（lobeline、arecoline）；Acetate 不是 quinine 的主要前驅物。']},
{c:'生合成',q:'Hyoscyamine 分子中 tropic acid 部分，其生合成前驅物為何？',o:['Ornithine','Phenylalanine','Acetate','Methionine'],a:1,e:[
'Ornithine 提供 tropine 的 pyrrolidine 環，而非 tropic acid。',
'Tropic acid（C6H5-CH-CH2OH-COOH）由 Phenylalanine 轉變而來，再與 tropine 酯化成 hyoscyamine。',
'3 個 Acetate 提供的是 tropine 的 piperidine 環上 C2、C3、C4。',
'Methionine（S-adenosylmethionine）提供 tropine 氮上的甲基。']},
{c:'生合成',q:'下列何者不是 nicotine 生合成之前驅物或中間體？',o:['quinolinic acid','nicotinic acid','ornithine','quinic acid'],a:3,e:[
'Aspartic acid＋glyceraldehyde-3-phosphate 縮合成 quinolinic acid，是 pyridine 環的中間體，故不選。',
'Quinolinic acid 脫水去氫成 nicotinic acid，再脫羧得 nicotine，故不選。',
'Ornithine 為 pyrrolidine 環的前驅物，經 putrescine、N-methylpyrrolinium 而來，故不選。',
'Quinic acid 與 nicotine 生合成無關（與莽草酸路徑有關的酸），為正確答案。']},
{c:'生物鹼',q:'Atropine 係指下列何者？',o:['(－)-Hyoscyamine','(＋)-Hyoscyamine','(±)-Hyoscyamine','(－)-Hyoscine'],a:2,e:[
'(－)-Hyoscyamine 是植物中的天然左旋形，具高活性，萃取過程在鹼性下會消旋成 atropine。',
'(＋)-Hyoscyamine 為其鏡像異構物，不是 atropine 的定義。',
'Atropine＝dl-hyoscyamine，即 (±)-Hyoscyamine 的消旋物，因 tropic acid 酯基受鹼影響使 C3 位立體結構改變。',
'(－)-Hyoscine 是 scopolamine（東莨菪鹼）的左旋名稱，含環氧結構。']},
{c:'生物鹼',q:'下列何者不是 cocaine 水解後的產物？',o:['methanol','benzyl alcohol','benzoic acid','ecgonine'],a:1,e:[
'Cocaine 為 ecgonine 甲酯的苯甲酸酯，水解得到 methanol。',
'Cocaine 水解不會產生 benzyl alcohol，為正確答案。',
'水解亦得 benzoic acid（苯甲酸）。',
'水解得 (－)-ecgonine，為半合成 cocaine 的原料。']},
{c:'生物鹼',q:'下列何種生藥含 tropane 類生物鹼，但不屬於茄科？',o:['顛茄（Belladonna）','曼陀羅（Stramonium）','古柯（Coca）','莨菪（Hyoscyamus）'],a:2,e:[
'顛茄為茄科，含 hyoscyamine、atropine、scopolamine。',
'曼陀羅為茄科，是 scopolamine 的主要來源。',
'古柯屬古柯樹科（Erythroxylaceae），含 cocaine 等 ecgonine 衍生物，不含 atropine，也不是茄科。',
'莨菪為茄科，種子為天仙子。']},
{c:'生物鹼',q:'Quinine 與 quinidine 之化學立體關係為何？',o:['enantiomers','diastereomers','geometric isomers','isotopes'],a:1,e:[
'Enantiomers 為鏡像關係，需所有不對稱中心相反；兩者並非如此。',
'Quinine（左旋）與 quinidine（右旋）只在部分不對稱中心構型不同，互為非鏡像立體異構物（diastereomers）。',
'Geometric isomers 是順反異構，與此無關。',
'Isotopes 是同位素，與此無關。']},
{c:'生物鹼',q:'下列何者為四級胺生物鹼，水溶性較佳？',o:['Berberine','Morphine','Ephedrine','Mescaline'],a:0,e:[
'Berberine（小蘗鹼）為四級胺，氮以共價鍵結合並帶正電，水溶性好；同類還有 sanguinarine、tubocurarine。',
'Morphine 為三級胺，呈弱鹼性，不易溶於水。',
'Ephedrine 為二級胺（生物鹼胺）。',
'Mescaline 為一級胺（生物鹼胺）。']},
{c:'生物鹼',q:'鴉片的鑑定係含有 meconic acid，加入氯化鐵試劑後呈現何種顏色？',o:['紅色','綠色','藍黑色','黃色'],a:0,e:[
'Meconic acid（罌粟酸）遇 FeCl3 呈紅色，為鴉片的鑑別反應。',
'綠色不是此鑑別反應的顏色。',
'藍黑色是酚類（如鞣質）遇鐵離子的反應。',
'黃色常見於 Hager 試劑（picric acid）沉澱，與鴉片鑑定無關。']},
{c:'生物鹼',q:'Codeine 與 morphine 在化學結構上之差異為何？',o:['Codeine 的 C-3 為 -OCH3，morphine 為 -OH','Codeine 的 C-6 為 -OCH3，morphine 為 -OH','Codeine 無 7、8 位雙鍵','Codeine 的氮為四級胺'],a:0,e:[
'Codeine 即甲基嗎啡，3 位酚基被甲基取代為 -OCH3，6 位仍為 -OH；morphine 的 3-OH 為酚基。',
'6 位兩者皆為醇基 -OH，差異在 3 位。',
'兩者皆有 7＝8 雙鍵。',
'兩者皆為三級胺，並非四級胺。']},
{c:'生物鹼',q:'Colchicine 雖含氮卻不呈明顯鹼性，主要原因為何？',o:['氮為醯胺（amide）氮，缺乏鹼性','分子中不含氮','氮為四級胺','氮位於 indole 環上'],a:0,e:[
'Colchicine 的 N 在乙醯胺基（amide）上，不在環上，屬 alkaloidal amine 且為中性鹼，無法與酸形成鹽類。',
'Colchicine 分子含氮（一個），並非不含氮。',
'四級胺帶正電且水溶，並非 colchicine 的結構。',
'Indole 環上氮屬吲哚類（如 reserpine），colchicine 不是 indole 類。']},
{c:'生物鹼',q:'Dragendorff 試劑的主要成分為何？',o:['碘化鉍鉀','碘＋碘化鉀','碘化汞鉀','苦味酸'],a:0,e:[
'Dragendorff 試劑為碘化鉍鉀，與生物鹼產生橘紅色沉澱。',
'碘＋碘化鉀是 Wagner 試劑，產生褐／紅棕色沉澱。',
'碘化汞鉀是 Mayer 試劑，產生淡黃色沉澱。',
'苦味酸是 Hager 試劑，產生黃色沉澱。']},
{c:'配醣體',q:'Mangiferin（芒果苷）屬於下列何種醣苷？',o:['O-glycoside','C-glycoside','N-glycoside','S-glycoside'],a:1,e:[
'O-glycoside 的糖以氧原子連接苷元，分布最廣（如 sennoside A、digitoxin、arbutin）；芒果苷不是。',
'Mangiferin（知母、芒果苷）的糖直接以碳碳鍵接在苷元上，為 C-glycoside，與 aloin、cochineal、spinosin 同類，分布最少。',
'N-glycoside 以氮連接，例如 ATP、UDP，與芒果苷無關。',
'S-glycoside 以硫連接，例如 sinigrin、sinalbin。']},
{c:'配醣體',q:'下列何者不屬於 C-glycoside？',o:['aloin A','mangiferin','sennoside A','cascaroside A'],a:2,e:[
'Aloin A（barbaloin，蘆薈）為 C-glycoside（糖接在 C-10）。',
'Mangiferin 為 C-glycoside。',
'Sennoside A（番瀉苷）的糖以氧連接，屬 O-glycoside，為正確答案。',
'Cascaroside A 同時含 C-與 O-glycoside（C-10 接糖、C-8 為 O-糖），仍含 C-glycoside。']},
{c:'配醣體',q:'下列何者為 S-glycoside？',o:['sinigrin','digitoxin','arbutin','ATP'],a:0,e:[
'Sinigrin 為硫配醣體（S-glycoside），經 myrosinase 水解得 allyl isothiocyanate、葡萄糖與 KHSO4。',
'Digitoxin 為強心苷，糖以氧連接，屬 O-glycoside。',
'Arbutin（熊果苷）為 O-glycoside，苷元為 hydroquinone。',
'ATP 含 N-glycosidic 鍵（adenosine），屬 N-glycoside。']},
{c:'配醣體',q:'固醇類藥物增加強心苷毒性，主要與細胞內何種離子濃度變化有關？',o:['鈉離子濃度增加','鉀離子濃度減少','鈣離子濃度增加','鈉離子濃度減少'],a:1,e:[
'細胞內鈉離子增加是強心苷抑制 Na⁺,K⁺-ATPase 的作用結果，不是毒性增加的關鍵。',
'強心苷與 K⁺ 競爭 Na⁺,K⁺-ATPase 結合位；血鉀降低時，強心苷結合增加，毒性上升，並易誘發心律不整。',
'高鈣確實會加重強心苷毒性，但本題中最直接者為低鉀，故不選。',
'細胞內鈉離子減少，會使強心作用減弱，而非毒性增加。']},
{c:'配醣體',q:'強心配醣體之不飽和內酯環，接在苷元的哪一個碳位？',o:['C-15','C-16','C-17','C-18'],a:2,e:[
'C-15 不是內酯環的接合位置。',
'C-16 不是內酯環的接合位置。',
'強心苷元的不飽和內酯環（cardenolide 為五員 butenolide，bufadienolide 為六員）接在 C-17 位。',
'C-18 為甲基位置，非內酯環接合處。']},
{c:'配醣體',q:'下列何種生藥含有 bufadienolide（蟾蜍二烯內酯）類強心配醣體？',o:['毛地黃葉（Digitalis leaf）','毒毛旋花子（Strophanthus）','鈴蘭（Convallaria）','海蔥（Squill）'],a:3,e:[
'毛地黃含 digitoxin、digoxin，屬 cardenolide（五員內酯）。',
'毒毛旋花子含 K-strophanthoside、ouabain，屬 cardenolide。',
'鈴蘭含 convallatoxin，屬 cardenolide。',
'海蔥含 scillaren A 等，為六員環雙不飽和內酯的 bufadienolide。']},
{c:'配醣體',q:'有關毛地黃（Digitalis purpurea）之敘述，下列何者正確？',o:['主成分 digoxin 經腎臟排除','主成分 digitoxin 脂溶性高、血漿蛋白結合率高，具蓄積性','科別為百合科','藥用部位為根'],a:1,e:[
'經腎臟排除的 digoxin 為長葉毛地黃（D. lanata）的臨床主要成分，不是 D. purpurea 的主要特徵。',
'Digitoxin 脂溶性、蛋白結合率高、分布體積小，具毒性與蓄積性；水解得 digitoxigenin＋3 digitoxose＋glucose。',
'毛地黃屬玄參科 Scrophulariaceae。',
'藥用部位為乾燥葉，不是根。']},
{c:'配醣體',q:'下列何者水解後可產生 rhamnose 與 glucose？',o:['frangulin A','frangulin B','glucofrangulin A','aloin A'],a:2,e:[
'Frangulin A 的醣基為 rhamnose 一種，苷元為 emodin。',
'Frangulin B 的醣基為 apiose。',
'Glucofrangulin A 的醣基為 rhamnose＋glucose，苷元為 emodin，符合題意。',
'Aloin A（barbaloin）的醣基只有 glucose，苷元為 aloe-emodin anthrone。']},
{c:'配醣體',q:'下列生藥所含之配醣體，其苷元不屬於 anthraquinone 類者為何？',o:['cascara sagrada','aloe','rhubarb','wild cherry'],a:3,e:[
'Cascara sagrada 含 cascarosides（苷元為 aloe-emodin 或 emodin 的 anthrone）。',
'Aloe 含 aloin（aloe-emodin anthrone），屬蒽醌類。',
'Rhubarb 含 sennoside、rhein 等蒽醌。',
'Wild cherry 含 prunasin，水解得 mandelonitrile，再成 benzaldehyde＋HCN，屬氰配醣體，不是蒽醌。']},
{c:'萜類與揮發油',q:'Triterpenoid 是由幾個 isoprene 單位所構成？',o:['2','4','6','8'],a:2,e:[
'2 個 isoprene 為單萜（C10H16）。',
'4 個 isoprene 為雙萜（C20H32）。',
'6 個 isoprene 為三萜（C30H48），如皂苷元、squalene。',
'8 個 isoprene 為四萜（C40H64），如 carotenoids。']},
{c:'萜類與揮發油',q:'下列何種科別之植物，其揮發油貯存於油管（oil tube, vittae）？',o:['唇形科','胡椒科','繖形科','松科'],a:2,e:[
'唇形科（Lamiaceae）的揮發油貯存於腺毛。',
'胡椒科貯存於變異柔細胞（modified parenchymal cells）。',
'繖形科（Apiaceae）的揮發油貯存於油管，如茴香、芫荽。',
'松科（Pinaceae）與芸香科貯存於離生或破生導管。']},
{c:'萜類與揮發油',q:'下列何者為製備揮發油之油脂吸附法（enfleurage）？',o:['直接蒸氣蒸餾法','壓榨法','冷吸法（enfleurage）','埃庫爾冷壓法'],a:2,e:[
'直接蒸氣蒸餾用於薄荷油、桂皮油、肉豆蔻油等。',
'壓榨法用於檸檬油、橙油等果皮精油。',
'Enfleurage 以油脂吸附花香成分，用於玫瑰油等不耐熱的花朵香精。',
'Ecuelle（埃庫爾）法為柑橘類果皮的刺磨冷法，與冷吸法不同。']},
{c:'樹脂與脂質',q:'有關 rosin（松香）之敘述，下列何者錯誤？',o:['屬 balsams 類','可作硬化劑（stiffening agent）','為 Pinus 屬植物之分泌物','主成分為 abietic acid 之 anhydrides'],a:0,e:[
'Rosin 為蒸去揮發油後的樹脂殘渣，主要為 resin（樹脂酸），不屬含肉桂酸或苯甲酸的 balsams 類，為錯誤敘述。',
'Rosin 可作硬化劑，如硬膏、貼布基質。',
'Rosin 為 Pinus 屬植物分泌物（含松節油）蒸餾後的殘渣。',
'主要成分為 abietic acid 的 anhydrides，與樹脂酸性質一致。']},
{c:'樹脂與脂質',q:'下列何種生藥可抑制愛滋病治療所致之噁心嘔吐，並具促進食慾之作用？',o:['opium','coca','marijuana（大麻）','khat'],a:2,e:[
'Opium 為麻醉性鎮痛，用於止痛與止瀉。',
'Coca 含 cocaine，為局部麻醉與中樞興奮劑。',
'大麻（Cannabis sativa）的 Δ9-THC 可緩解化療與愛滋病引起的嘔吐，並刺激食慾、治療厭食症，主要存在雌花。',
'Khat 含 cathinone，咀嚼可減飢與疲勞，不是促進食慾。']},
{c:'樹脂與脂質',q:'下列何種生藥可作為牙齒封填劑（dental varnish）？',o:['eriodictyon','colophony','mastic（乳香）','myrrh'],a:2,e:[
'Eriodictyon（北美聖草）藥用葉部，具祛痰與掩蓋 quinine 苦味的作用。',
'Colophony（松香）用於硬膏，作硬化劑，不是牙齒封填材料。',
'Mastic 為漆樹科 Pistacia lentiscus 的凝固樹脂，用作牙科封填與齲齒填充劑。',
'Myrrh（沒藥）為膠質樹脂，用於漱口劑與消炎，不是封填劑。']},
{c:'樹脂與脂質',q:'下列何者為 18:3（n-3 或 ω3）的脂肪酸？',o:['linoleic acid','linolenic acid','ricinoleic acid','arachidonic acid'],a:1,e:[
'Linoleic acid 為 18:2（ω6），雙鍵 9Z、12Z。',
'Linolenic acid 為 18:3（ω3），雙鍵 9Z、12Z、15Z，含 3 個雙鍵。',
'Ricinoleic acid 為 18:1，含 9Z 雙鍵與 12-OH，為蓖麻油成分。',
'Arachidonic acid 為 20:4，非 18 碳。']},
{c:"多醣類",q:"下列何種植物不富含菊糖（inulin）？",o:["kohlrabi（大頭菜）", "lappa（牛蒡）", "chicory（菊苣）", "echinacea（紫錐菊）"],a:0,e:["大頭菜為十字花科，儲存物質不以菊糖為主，為正確答案。", "牛蒡為菊科，地下部富含菊糖。", "菊苣為菊科，根部富含菊糖。", "紫錐菊為菊科，富含菊糖。"]},
{c:"多醣類",q:"有關 hetastarch 之敘述，下列何者錯誤？",o:["最初自乳酸桿菌 Leuconostoc mesenteroides 分離得到", "含有 90% 的 amylopectin", "每 10 個 glucose 單體上約具 7～8 個 hydroxyethyl 取代基", "其 6% 製劑可作為血漿擴充劑"],a:0,e:["從 Leuconostoc mesenteroides 發酵蔗糖得到的是 dextran，不是 hetastarch，為錯誤敘述。", "Hetastarch 由含 90% amylopectin（α-1,4 與 α-1,6）的澱粉經羥乙基化而成。", "每 10 個 glucose 約有 7～8 個 hydroxyethyl 取代基，正確。", "6% hetastarch 用於血漿擴充，可用於止血、燒傷休克。"]},
{c:"多醣類",q:"有關 dextran 之敘述，下列何者正確？",o:["主要為 α-1,4-linked glucan", "主要為 α-1,6-linked glucan", "為 β-2,1-linked fructan", "為 β-2,6-linked fructan"],a:1,e:["α-1,4 為 amylose 的鍵結，不是 dextran。", "Dextran 由 Leuconostoc 的 transglucosylase 作用蔗糖形成，主鏈為 α-1,6 鍵結的葡萄糖聚合物，可作血漿擴充劑。", "β-2,1-fructan 為 inulin。", "β-2,6-fructan 為 levan 類，不是 dextran。"]},
{c:"多醣類",q:"下列何者不是阿拉伯膠（acacia）的用途？",o:["膨脹性瀉劑（bulk laxative）", "乳化劑", "緩和劑（demulcent）", "懸浮劑"],a:0,e:["膨脹性瀉劑是 karaya gum、plantago seed 等的用途，阿拉伯膠不是，為正確答案。", "阿拉伯膠為常用乳化劑。", "阿拉伯膠可作緩和劑。", "阿拉伯膠可作懸浮劑。"]},
{c:"多醣類",q:"下列何者不是 karaya gum（梧桐膠）的用途？",o:["製錠時製粒之黏合劑（binder）", "乳化劑", "膨脹性緩瀉劑", "牙科黏著劑"],a:0,e:["製錠黏合劑為阿拉伯膠、西黃耆膠等的用途，不是梧桐膠的特色，為正確答案。", "梧桐膠可作乳化劑。", "梧桐膠吸水膨脹，用作膨脹性緩瀉劑。", "梧桐膠具黏性，用作牙科黏著劑。"]},
{c:"多醣類",q:"西黃耆膠（tragacanth）在所有親水性膠體中，何種特性最強？",o:["對酸耐受性最大（可抗酸水解）", "溶解度最低", "含硫酸酯最多", "可被澱粉酶水解"],a:0,e:["西黃耆膠主要成分 bassorin，對酸耐受性最大，可抗酸水解。", "溶解度最低者為梧桐膠（karaya gum）。", "含硫酸酯多的是 carrageenan、agar 等海洋膠。", "西黃耆膠非澱粉，與澱粉酶無關。"]},
{c:"多醣類",q:"鹿角菜膠（carrageenan）與瓊脂（agar）在化學構造上之最大差異為何？",o:["前者有較高的硫酸酯基", "前者以葡萄糖為主，後者以半乳糖為主", "前者以 1,6 鍵結為主", "後者具 3,6-anhydro 架構，前者則無"],a:0,e:["Carrageenan 含硫酸酯較多（agar 以 agarose 為主，硫酸酯較少），為最大差異。", "兩者皆以半乳糖為主體。", "兩者皆以 1,3 與 1,4 交替鍵結為主。", "兩者都含 3,6-anhydrogalactose 架構。"]},
{c:"多醣類",q:"有關 guar gum 與 locust bean gum 之敘述，下列何者錯誤？",o:["二者皆由種子的外胚乳磨碎而得", "植物基源皆屬豆科", "皆屬增稠劑", "二者皆為 galactomannan"],a:0,e:["兩者取自種子內胚乳，而非外胚乳，為錯誤敘述。", "瓜耳膠 Cyamopsis tetragonolobus 與刺槐豆膠 Ceratonia siliqua 皆屬豆科。", "皆可作增稠劑。", "皆為半乳甘露聚醣（galactomannan）。"]},
{c:"多醣類",q:"下列何者屬於「種子膠」？",o:["阿拉伯膠", "西黃耆膠", "瓜耳膠（guar gum）", "黃原膠"],a:2,e:["阿拉伯膠為滲出膠（植物受傷分泌）。", "西黃耆膠為滲出膠。", "瓜耳膠取自瓜耳豆種子內胚乳，為種子膠，同類還有刺槐豆膠。", "黃原膠為微生物膠（Xanthomonas campestris）。"]},
{c:"多醣類",q:"下列何者之主要成分是果膠（pectin）所含的 α-1,4-linked 單位？",o:["D-galacturonic acid", "D-mannuronic acid", "L-guluronic acid", "D-xylose"],a:0,e:["果膠由半乳糖醛酸（α-1,4-D-galacturonic acid）聚合，可降低毒害、止瀉（如 Kaopectate）。", "D-mannuronic acid 是海藻酸的成分之一。", "L-guluronic acid 為海藻酸的另一成分。", "D-xylose 組成 xylan，為半纖維素。"]},
{c:"多醣類",q:"下列何者不屬於半纖維素（hemicelluloses）類？",o:["rhamnogalacturonan", "xyloglucan", "inulin", "pectin"],a:2,e:["Rhamnogalacturonan 屬半纖維素類（含 rhamnose 與 galacturonic acid）。", "Xyloglucan 由 xylose 與 glucan 組成，屬半纖維素。", "Inulin 為 β-2,1 fructan，屬儲存醣，不是半纖維素，為正確答案。", "Pectin 在此題分類下與半纖維素同屬細胞壁多醣類，不是答案。"]},
{c:"多醣類",q:"Sodium alginate 的主要基源植物為何？",o:["Claviceps purpurea", "Chondrus crispus", "Gracilaria confervoides", "Macrocystis pyrifera"],a:3,e:["Claviceps purpurea 為麥角菌。", "Chondrus crispus 為紅藻，來源 carrageenan。", "Gracilaria 為紅藻，來源 agar。", "Macrocystis pyrifera 為褐藻（巨藻科），藻酸鈉由 D-mannuronic acid 與 L-guluronic acid 組成。"]},
{c:"苯丙烷與木酚素",q:"辣椒（Capsicum）之辣味成分 capsaicin，在果實中何部位含量最高？",o:["種子", "種皮", "隔膜", "果蒂"],a:2,e:["種子含量低，辣感常來自接觸隔膜。", "種皮含量不是最高。", "Capsaicin 在果實隔膜含量最高，為辛辣味來源，可耗盡 Substance P 而止痛。", "果蒂不是 capsaicin 的主要貯存部位。"]},
{c:"苯丙烷與木酚素",q:"下列何種基源植物含有抗凝血成分 dicumarol？",o:["Dipteryx odorata", "Ammi visnaga", "Apium graveolens", "Melilotus officinalis"],a:3,e:["Dipteryx odorata 為香豆（tonka bean），含 coumarin。", "Ammi visnaga 含 khellin。", "Apium graveolens（芹菜）含 furocoumarin 光敏成分。", "Melilotus officinalis（甜苜蓿，豆科）變質後產生 dicumarol，干擾 vitamin K，可抗凝血。"]},
{c:"苯丙烷與木酚素",q:"補骨脂所含的 psoralen 屬於下列何種成分？",o:["monoterpenoid phenol", "flavonoid", "furocoumarin", "chalcone"],a:2,e:["Monoterpenoid phenol 如 thymol。", "Flavonoid 為 C6-C3-C6 結構。", "Psoralen 為含呋喃環的 furocoumarin，具光敏感性，可治牛皮癬、白斑症。", "Chalcone 是類黃酮前驅物。"]},
{c:"苯丙烷與木酚素",q:"Khellin 的結構類型為何？",o:["furochromone", "furocoumarin", "anthraquinone", "isoquinoline"],a:0,e:["Khellin 含 benzo-γ-pyrone，屬 furochromone，來自 Ammi visnaga（繖形科）果實，可擴張冠狀動脈、治氣喘。", "Furocoumarin 為 psoralen、methoxsalen 的類型。", "Anthraquinone 為蒽醌類。", "Isoquinoline 為生物鹼骨架。"]},
{c:"苯丙烷與木酚素",q:"紫錐菊（Echinacea）所含之 chicoric acid，其結構具有幾個 phenylpropanoid 單元？",o:["1", "2", "3", "4"],a:1,e:["Chicoric acid 不只一個單元。", "Chicoric acid（bis-hydroxycinnamic acid）具 2 個 phenylpropanoid 單元，Echinacea 具免疫刺激作用。", "不是 3 個。", "不是 4 個。"]},
{c:"苯丙烷與木酚素",q:"普達飛輪（Podophyllum peltatum）之基源科別為何？",o:["毛茛科", "小蘗科", "罌粟科", "百合科"],a:1,e:["毛茛科如黃連、北美黃連、烏頭。", "Podophyllum（Berberidaceae）為小蘗科，乾燥根莖與根含 resin 3～6%，主要活性為 lignan 類 podophyllotoxin。", "罌粟科如罌粟、血根。", "百合科如秋水仙、藜蘆。"]},
{c:"苯丙烷與木酚素",q:"Etoposide 為 podophyllotoxin 之半合成衍生物，其作用機轉為何？",o:["抑制 topoisomerase II", "抑制微管聚合", "抑制 DNA 旋轉酶（gyrase）", "抑制二氫葉酸還原酶"],a:0,e:["Etoposide 可誘導 DNA 斷裂，抑制 topoisomerase II，用於睪丸癌、小細胞肺癌。", "抑制微管聚合為 vinca 生物鹼的機轉，不是 etoposide。", "DNA gyrase 為 quinolone 類抗菌藥的標的。", "二氫葉酸還原酶為 methotrexate 的標的。"]},
{c:"苯丙烷與木酚素",q:"下列有關 Lignan 的敘述，何者正確？",o:["為兩個 phenylpropene 衍生物，在 C3 側鏈 β-碳聚合而成", "為單一 C6-C3 單元", "生合成與 shikimic acid 路徑無關", "不具有抗微生物活性"],a:0,e:["Lignan 為二聚體，兩個 phenylpropene 的 β 碳連結，主結構含 18 個碳。", "單一 C6-C3 為 simple phenylpropanoid。", "Lignan 由 shikimic acid→p-coumaric acid→caffeic acid→ferulic acid→coniferyl alcohol 而來。", "Lignan 為植物防禦成分，具抗微生物、抗真菌等作用。"]},
{c:"類黃酮與鞣質",q:"Flavonoid 的基本骨架為下列何者？",o:["C6-C3-C6", "C6-C3", "C6-C3-C3-C6", "C5-C5"],a:0,e:["Flavonoid 由一個芳香環（A 環）與 C3 側鏈的 phenylpropanoid 結合，共 15 個碳，為 C6-C3-C6。", "C6-C3 為單純 phenylpropanoid（如 cinnamic acid）。", "C6-C3-C3-C6 為 lignan 二聚體的骨架。", "C5-C5 為 isoprene 單位，與 flavonoid 無關。"]},
{c:"類黃酮與鞣質",q:"有關 milk thistle（Silybum marianum）之敘述，下列何者錯誤？",o:["其主要單一化合物為 silymarin", "主要成分結構屬於 flavonolignans", "silybin 主要功效為保護肝臟", "silymarin 可促進 DNA-dependent RNA polymerase I 活性"],a:0,e:["Silymarin 是混合物（含 silybin 主成分、isosilybin、silydianin），不是單一化合物，為錯誤敘述。", "Silymarin 成分屬 flavonolignan（flavonoid 與 lignan 結合）。", "Silybin 為主成分，保護肝臟、治療慢性肝炎與肝硬化。", "Silymarin 可促進肝臟細胞 RNA polymerase I，增加蛋白質合成而保肝。"]},
{c:"類黃酮與鞣質",q:"Silybin 之化學結構分類屬於下列何者？",o:["bisflavone", "meroterpenoid", "flavonolignan", "neolignan"],a:2,e:["Bisflavone 是兩個 flavone 二聚體，如銀杏的 ginkgetin。", "Meroterpenoid 為萜類與非萜類混合來源。", "Silybin 為 flavonoid 與 phenylpropanoid 結合的 flavonolignan，出自菊科乳薊。", "Neolignan 是 lignan 的另一類連結方式，不是 silybin 的分類。"]},
{c:"類黃酮與鞣質",q:"有關 rutin（芸香苷）之敘述，下列何者錯誤？",o:["是一種 galactoglucoside", "其非醣體為 quercetin", "為 vitamin P 之一員", "富含於 Sophora 屬植物"],a:0,e:["Rutin 的醣基為 rutinose（glucose＋rhamnose），為 rhamnoglucoside，不是 galactoglucoside，為錯誤敘述。", "Rutin 為 quercetin 的 rutinoside，非醣體為 quercetin。", "Rutin、hesperidin 稱 vitamin P（滲透因子），可強化微血管功能。", "槐花（Sophora japonica，豆科）富含 rutin。"]},
{c:"類黃酮與鞣質",q:"下列化合物，何者之完全水解產物不含鼠李糖（rhamnose）？",o:["rutin", "naringin", "hesperidin", "hyperoside"],a:3,e:["Rutin 含 rutinose（glucose＋rhamnose）。", "Naringin（柚皮苷）含 neohesperidose，含 rhamnose。", "Hesperidin 含 rutinose，含 rhamnose。", "Hyperoside 為 quercetin-3-O-galactoside，只含半乳糖，不含鼠李糖。"]},
{c:"類黃酮與鞣質",q:"中藥陳皮之 hesperidin 又稱為下列何者？",o:["vitamin A", "vitamin D", "vitamin E", "vitamin P"],a:3,e:["Vitamin A 為視黃醇，與 hesperidin 無關。", "Vitamin D 為固醇類。", "Vitamin E 為生育醇。", "Hesperidin（及 rutin）具有調節微血管通透性的作用，故稱 vitamin P。"]},
{c:"類黃酮與鞣質",q:"有關鞣質（tannin）之敘述，下列何者錯誤？",o:["可與蛋白質、生物鹼、重金屬鹽形成沉澱", "與鐵鹽（FeCl3）可形成墨綠色或暗藍色化合物", "具有收斂性", "在鹼性環境下穩定"],a:3,e:["Tannin 能沉澱蛋白質、生物鹼與重金屬，故可作生物鹼中毒解毒劑。", "與 FeCl3 呈墨綠或暗藍色，可作鞣質的測試。", "Tannin 具收斂性，可作收斂劑。", "Tannin 在酸性環境較穩定，在鹼性環境下易快速氧化，為錯誤敘述。"]},
{c:"類黃酮與鞣質",q:"下列何種生藥主要含有水解型鞣質（hydrolyzable tannin）？",o:["Japanese gall（五倍子）", "tea leaf（茶葉）", "grape seed（葡萄籽）", "areca nut（檳榔子）"],a:0,e:["五倍子含 gallotannin（沒食子酸＋glucose），為典型水解型鞣質。", "茶葉含 catechin、EGCG 等縮合型鞣質。", "葡萄籽含 proanthocyanidin，屬縮合型。", "檳榔子含 arecatannin，屬縮合型。"]},
{c:"類黃酮與鞣質",q:"下列何者為水解型鞣質（hydrolyzable tannin）？",o:["proanthocyanidin", "hamamelitannin", "leucocyanidin", "pycnogenol"],a:1,e:["Proanthocyanidin 為縮合型，由 flavan-3-ol 聚合。", "Hamamelitannin（北美金縷梅葉）屬水解型，水解得 gallic acid 與糖。", "Leucocyanidin（flavan-3,4-diol）為縮合型的單位。", "Pycnogenol（松樹皮萃取）為 proanthocyanidin 類，屬縮合型。"]},
{c:"類黃酮與鞣質",q:"有關 proanthocyanidin 之敘述，下列何者錯誤？",o:["為 condensed tannin", "加熱處理後單體間之 C-C 鍵結易斷裂", "其單體大部分為 flavan-3-ol", "具抗氧化作用"],a:1,e:["Proanthocyanidin 為縮合型鞣質，正確。", "縮合型鞣質單體間以 C-C 鍵相連，加熱後鍵結不易斷裂，為錯誤敘述。", "單體主要為 flavan-3-ol（catechin）。", "具清除自由基、抗氧化作用。"]},
{c:"類黃酮與鞣質",q:"五倍子（Chinese gall）所含之 tannin，主要為下列何者組成之混合物？",o:["catechin", "proanthocyanidin", "leucocyanidin", "galloyl glucose"],a:3,e:["Catechin 為縮合型鞣質的單體。", "Proanthocyanidin 為縮合型。", "Leucocyanidin 為縮合型單位。", "五倍子（Rhus chinensis，漆樹科）的 gallotannin 是以 glucose 為核心，連接 galloyl 基形成的混合物。"]},
{c:"類黃酮與鞣質",q:"下列何者與水解型鞣質（hydrolyzable tannin）之組成無關？",o:["gallic acid", "catechin", "hexahydroxydiphenic acid", "glucose"],a:1,e:["Gallic acid 為構成單位。", "Catechin 為 flavan-3-ol，屬縮合型鞣質的單位，與水解型無關，為正確答案。", "Hexahydroxydiphenic acid 為 ellagitannin 的單位，水解成 ellagic acid。", "Glucose 為水解型鞣質的核心糖。"]},
{c:"類黃酮與鞣質",q:"沒食子（nutgall）的基源植物與科別為何？",o:["Quercus infectoria，殼斗科（山毛櫸科 Fagaceae）", "Rhus chinensis，漆樹科", "Hamamelis virginiana，金縷梅科", "Silybum marianum，菊科"],a:0,e:["沒食子為 Quercus infectoria 的蟲癭，屬殼斗科，主要成分 tannin（gallic acid）。", "Rhus chinensis（漆樹科）為五倍子基源。", "Hamamelis virginiana（金縷梅科）為北美金縷梅葉。", "Silybum marianum 為乳薊。"]},
{c:"類黃酮與鞣質",q:"鞣酸（tannic acid）可作為生物鹼中毒的解毒劑，主要原因為何？",o:["能與生物鹼形成沉澱", "能中和胃酸", "能氧化分解生物鹼", "能抑制膽鹼酯酶"],a:0,e:["鞣酸水溶性佳，但與生物鹼、蛋白質、配醣體產生沉澱（無專一性），可使生物鹼沉澱，減少吸收。", "鞣酸本身偏酸性，主要作用不是中和胃酸。", "鞣酸並不氧化分解生物鹼。", "抑制膽鹼酯酶是毒扁豆鹼的作用。"]},
{c:"類黃酮與鞣質",q:"下列生藥與其基源植物之科別配對，何者錯誤？",o:["nutgall－Fagaceae", "milk thistle－Asteraceae", "capsicum－Solanaceae", "echinacea－Lamiaceae"],a:3,e:["沒食子（Quercus infectoria）為殼斗科（Fagaceae）。", "乳薊（Silybum marianum）為菊科。", "辣椒（Capsicum）為茄科。", "紫錐菊（Echinacea）為菊科 Asteraceae，不是唇形科，為錯誤配對。"]},
{c:"苯丙烷與木酚素",q:"有關 podophyllotoxin 之敘述，下列何者錯誤？",o:["其基源植物之科別為小蘗科", "活性成分屬於 lignan 類", "在弱鹼性條件下，內酯環易產生 epimerization 形成 trans isomer", "Podophyllum emodi 之含量高於 P. peltatum"],a:2,e:["Podophyllum 屬小蘗科 Berberidaceae。", "Podophyllotoxin 為 lignan，具抗有絲分裂與瀉下作用。", "在弱鹼性條件下，trans-lactone 會 epimerization 形成較穩定的 cis form（失去活性），不是形成 trans，故此敘述錯誤。", "印度普達飛輪 P. emodi 樹脂含 11～12%，約為 P. peltatum 的兩倍。"]},
{c:"苯丙烷與木酚素",q:"Teniposide 與 etoposide 結構上不同之處在於醣基上的何者？",o:["Thenylidene（噻吩亞甲基）", "Ethylidene", "Benzylidene", "Methylidene"],a:0,e:["Teniposide 的醣基上接有 thenylidene，用於急性淋巴性白血病。", "Etoposide 的醣基為 ethylidene glucose（不是鼠李糖）。", "Benzylidene 不是此二藥的取代基。", "Methylidene 不是此二藥的取代基。"]},
{c:"苯丙烷與木酚素",q:"有關 etoposide 化學結構敘述，下列何者錯誤？",o:["具有反式內酯環", "含有酚基", "由二個 C6-C3 單元組成", "含有鼠李糖基"],a:3,e:["Etoposide 為 podophyllotoxin 衍生物，內酯環為反式，保留活性。", "C4'-OH 酚基可增加抗癌活性。", "屬 lignan，由兩個 C6-C3 單元組成。", "Etoposide 的醣基為 ethylidene glucose，不含鼠李糖，為錯誤敘述。"]},
{c:"配醣體",q:"下列何者不是強心配醣體之作用機轉？",o:["抑制心肌細胞上 Na⁺,K⁺-ATPase", "增加心肌細胞內 Na⁺ 濃度", "減少心肌細胞內 K⁺ 濃度", "減少心肌細胞內 Ca²⁺ 濃度"],a:3,e:["強心苷抑制 Na⁺,K⁺-ATPase，為其主要機轉。", "抑制後鈉離子在細胞內蓄積。", "鉀離子泵入減少，胞內 K⁺ 下降。", "胞內 Na⁺ 增加，經 Na⁺-Ca²⁺ 交換使 Ca²⁺ 增加而增強收縮，不是減少，為錯誤敘述。"]},
{c:"配醣體",q:"下列何者不是 2,6-去氧糖？",o:["L-thevetose", "D-digitoxose", "L-oleandrose", "D-cymarose"],a:0,e:["L-thevetose 只有 6-去氧（3-O-甲基-6-去氧糖），不是 2,6-去氧糖，為正確答案。", "D-digitoxose 為 2,6-去氧糖，毛地黃苷的醣基。", "L-oleandrose 為 2,6-去氧-3-O-甲基糖。", "D-cymarose 為 2,6-去氧-3-O-甲基糖。"]},
{c:"配醣體",q:"下列何種試驗可用於檢測強心苷中的 2,6-去氧糖？",o:["Keller-Kiliani test", "Fehling test", "Borntrager test", "Vitali-Morin test"],a:0,e:["Keller-Kiliani 由紅棕色環變藍色，用於檢測 2,6-去氧糖（含 digitoxose、cymarose、oleandrose）。", "Fehling 檢測還原糖（單醣、雙醣）。", "Borntrager 檢測蒽醌類，呈紅色。", "Vitali-Morin 用於 tropane 生物鹼，呈紫色。"]},
{c:"配醣體",q:"有關強心配醣體基本骨架之敘述，下列何者錯誤？",o:["C-3 位上 OH 為 β-型", "lactone ring 取代在 C-17 上", "C-14 位上之 OH 為 α-型", "A/B/C/D 四個環連接方式為 cis-trans-cis"],a:2,e:["C3 的羥基為 β 型，可接糖形成苷。", "Lactone ring（五或六員不飽和內酯環）接在 C-17。", "C-14 的 OH 為 β 型，不是 α 型，為錯誤敘述。", "強心苷環系連接為 A/B cis、B/C trans、C/D cis。"]},
{c:"配醣體",q:"有關 digoxin 與 digitoxin 之比較，下列何者正確？",o:["digoxin 水溶性較高、半衰期較短、分布體積較大", "digoxin 脂溶性高、具蓄積性", "digitoxin 半衰期較短", "digitoxin 主要經腎臟排除"],a:0,e:["Digoxin（長葉毛地黃）水溶性、半衰期短、分布體積大，由腎臟排除，腎功能不良者需調整或避免使用。", "脂溶性高、蛋白結合率高、具蓄積性的是 digitoxin。", "Digitoxin 半衰期較長。", "Digitoxin 主要經肝代謝，腎功能不良者較適用。"]},
{c:"配醣體",q:"有關 K-strophanthoside 與 ouabain 之敘述，下列何者錯誤？",o:["兩者水解後均會釋放葡萄糖", "兩者的非醣基部分皆屬 cardenolide", "後者可注射使用", "後者的基源植物為 Strophanthus gratus"],a:0,e:["K-strophanthoside 水解可得葡萄糖，但 ouabain 水解得 ouabagenin＋rhamnose，不產生葡萄糖，為錯誤敘述。", "兩者非醣體部分皆為 cardenolide（strophanthidin、ouabagenin）。", "Ouabain 極性高、腸胃吸收差，適合 IV 輸注。", "Ouabain（G-strophanthin）來自 Strophanthus gratus（平滑毒毛旋花子）。"]},
{c:"配醣體",q:"紅海蔥（red squill）主要用途為何？",o:["殺鼠劑", "強心劑", "催吐劑", "局部麻醉劑"],a:0,e:["紅海蔥含 glucoscillaren A，作殺鼠劑。", "白海蔥（white squill）才用於強心、祛痰、利尿。", "催吐為吐根、北美山梗菜等的作用。", "局部麻醉如古柯鹼，與海蔥無關。"]},
{c:"配醣體",q:"下列何種強心配醣體生藥為動物來源？",o:["蟾酥（Bufonis）", "黑藜蘆", "夾竹桃", "海蔥"],a:0,e:["蟾酥取自蟾蜍皮膚腺分泌物，含 bufotalin 等 bufadienolide，是唯一的動物性強心苷來源。", "黑藜蘆為毛茛科植物，含 hellebrin。", "夾竹桃為夾竹桃科植物，含 oleandrin。", "海蔥為百合科植物鱗莖，含 scillaren。"]},
{c:"配醣體",q:"下列強心苷生藥之基源植物，何者不屬於夾竹桃科（Apocynaceae）？",o:["dog bane（Apocynum）", "oleander（夾竹桃）", "squill（海蔥）", "Strophanthus"],a:2,e:["Apocynum（白麻、羅布麻）屬夾竹桃科。", "夾竹桃（Nerium oleander）屬夾竹桃科。", "海蔥（Urginea maritima）屬百合科，為正確答案。", "毒毛旋花子屬夾竹桃科。"]},
{c:"配醣體",q:"蒽醌類成分在植物體內，係由下列何種路徑合成？",o:["acetate-malonate pathway", "acetate-mevalonate pathway", "shikimic acid pathway", "amino acid pathway"],a:0,e:["蒽醌由乙酸-丙二酸（polyketide）途徑，頭尾縮合而成。", "Acetate-mevalonate 產生萜類、固醇類。", "Shikimic acid 產生 phenylpropanoid 與芳香族化合物。", "Amino acid 路徑產生生物鹼。"]},
{c:"配醣體",q:"美鼠李皮（cascara sagrada）須存放一年以上才供藥用，主要原因為何？",o:["使還原型 anthrone 氧化為作用較溫和的 anthraquinone", "使樹皮乾燥", "使鞣質分解", "使揮發油揮散"],a:0,e:["新鮮樹皮含 anthrone 等還原型成分，瀉下強而易引起嘔吐、腹絞痛；存放後氧化成 anthraquinone，作用溫和（還原型 anthranol 強度大於氧化型）。", "乾燥並非主要目的。", "鞣質不是主要考量。", "樹皮不以揮發油為主成分。"]},
{c:"配醣體",q:"Frangulin A 與 Frangulin B 之差異，主要在於何者？",o:["醣基種類不同", "醣基數目不同", "醣基結合位置不同", "醣基結合立體方位不同"],a:0,e:["兩者苷元皆為 emodin：frangulin A 接 rhamnose，frangulin B 接 apiose（芹菜糖），故為醣基種類不同。", "兩者皆為單醣基。", "兩者結合位置相同。", "不是立體方位差異。"]},
{c:"配醣體",q:"Aloin A 與 Aloin B（barbaloin、isobarbaloin）之關係為何？",o:["C-10 的立體異構物（diastereoisomers）", "結構完全相同", "一為 C-glycoside，另一為 O-glycoside", "一為蒽醌，另一為二蒽酮"],a:0,e:["Aloin A、B 為 C-glycoside，互為 C-10 的立體異構物。", "兩者構型不同，並非相同。", "兩者皆為 C-glycoside。", "兩者苷元皆為 aloe-emodin anthrone。"]},
{c:"配醣體",q:"大黃（rhubarb）藥材橫切面可見之「星點」，其構造為何？",o:["異常維管束", "草酸鈣簇晶", "石細胞群", "油細胞"],a:0,e:["大黃根莖髓部有放射狀排列的異常維管束，在斷面呈星點，是鑑別特徵。", "大黃粉末含草酸鈣簇晶（砂粒感），但不是星點。", "石細胞並非星點的構造。", "油細胞不是大黃的主要鑑別特徵。"]},
{c:"配醣體",q:"下列何種生藥主含 rhein dianthrone glycosides 類成分？",o:["rhubarb", "aloe", "senna", "frangula"],a:2,e:["大黃含 rhein anthrone、tannin、catechin，主要不是 dianthrone。", "蘆薈含 aloin（anthrone C-glycoside）。", "番瀉葉（Cassia acutifolia、angustifolia）含 sennoside A、B，為 rhein dianthrone 的立體異構物。", "歐鼠李皮含 emodin 苷（frangulin）。"]},
{c:"配醣體",q:"下列何種配醣體，其 glycone 非為 glucose？",o:["amygdalin", "frangulin A", "aloin B", "salicin"],a:1,e:["Amygdalin 含兩個葡萄糖（龍膽二糖）。", "Frangulin A 的醣基為 rhamnose，為正確答案。", "Aloin B 的醣基為 glucose。", "Salicin 的醣基為 glucose。"]},
{c:"配醣體",q:"下列何者不屬於固醇類皂苷（steroidal saponin）？",o:["sarsaponin", "digitonin", "saikosaponin A", "dioscin"],a:2,e:["Sarsaponin（菝葜）為固醇類皂苷。", "Digitonin（毛地黃）為固醇類皂苷。", "Saikosaponin A（柴胡）為三萜類皂苷，為正確答案。", "Dioscin（薯蕷）為固醇類皂苷，苷元 diosgenin。"]},
{c:"配醣體",q:"有關甘草（Glycyrrhiza glabra）之敘述，下列何者正確？",o:["glycyrrhetic acid 水解得葡萄糖", "glycyrrhizin 屬二萜皂苷", "高血壓患者宜注意避免過度使用", "甘草屬於茄科"],a:2,e:["Glycyrrhizin 水解得 glycyrrhetinic acid 與 2 個 glucuronic acid（葡萄糖醛酸）。", "Glycyrrhizin 為 β-amyrin 型五環三萜皂苷。", "Glycyrrhizin 具 cortisol-like 作用，造成鈉水滯留、鉀排出，高血壓患者應避免過量。", "甘草屬豆科 Fabaceae。"]},
{c:"配醣體",q:"人參皂苷 Rg1 之苷元（aglycone）為何？",o:["α-amyrin", "β-amyrin", "(20S)-protopanaxatriol", "(20S)-protopanaxadiol"],a:2,e:["α-amyrin 為 ursane 型，與人參無關。", "β-amyrin 為甘草酸的苷元型。", "Ginsenoside Rg1 為 (20S)-protopanaxatriol 型（四環三萜 dammarane），醣基在 C6、C20。", "Protopanaxadiol 為 Rb 類的苷元，不是 Rg1。"]},
{c:"配醣體",q:"下列何者在商業上常被用來製造 corticosteroids 之原料？",o:["sarmentogenin", "hecogenin", "sarsapogenin", "trigonelline"],a:1,e:["Sarmentogenin 為強心苷元。", "Hecogenin 來自龍舌蘭（Agave），為製造 corticosteroids 的原料。", "Sarsapogenin 為菝葜的皂苷元，主要為皂素。", "Trigonelline 為生物鹼（葫蘆巴）。"]},
{c:"配醣體",q:"野櫻樹皮（wild cherry）具有鎮咳祛痰作用，其所含的 prunasin 屬於何種配醣體？",o:["isothiocyanate glycoside", "cyanogenic glycoside", "anthraquinone glycoside", "flavonoid glycoside"],a:1,e:["Isothiocyanate glycoside 如 sinigrin。", "Prunasin 水解得 mandelonitrile，再成 benzaldehyde＋HCN，為氰配醣體。", "Anthraquinone glycoside 如 cascaroside。", "Flavonoid glycoside 如 rutin。"]},
{c:"配醣體",q:"Amygdalin 經 amygdalin hydrolase（amygdalase）水解後，可形成的產物含有幾個單醣基？",o:["1", "2", "3", "4"],a:0,e:["Amygdalin（含兩個葡萄糖）經 amygdalase 水解成 prunasin＋1 分子 glucose，再由 prunase 水解 prunasin 得 mandelonitrile 與另一個 glucose。", "不是 2 個。", "不是 3 個。", "不是 4 個。"]},
{c:"配醣體",q:"下列何者不是 sinigrin 經 myrosinase 水解後的產物？",o:["glucose", "allyl isothiocyanate", "rhamnose", "potassium hydrogen sulfate"],a:2,e:["水解產生葡萄糖（Glc）。", "產生 allyl isothiocyanate（芥子油，揮發性）。", "Sinigrin 水解不產生 rhamnose，為正確答案。", "產生 KHSO4（硫酸氫鉀）。"]},
{c:"配醣體",q:"黑芥子（black mustard）與白芥子（white mustard）之比較，下列何者正確？",o:["黑芥子主要成分 sinigrin，水解物 allyl isothiocyanate 揮發性大", "白芥子主要成分 sinigrin", "兩者皆屬 O-glycoside", "兩者皆為豆科植物"],a:0,e:["黑芥子（Brassica nigra）含 sinigrin，水解成揮發性大的 allyl isothiocyanate。", "白芥子（Brassica alba）含的是 sinalbin，水解得揮發性較小的 acrinyl isothiocyanate。", "異硫氰苷皆屬 S-glycoside。", "兩者皆屬十字花科。"]},
{c:"配醣體",q:"有關大蒜（garlic）之敘述，下列何者錯誤？",o:["基源植物為 Allium sativum（百合科）", "其完整細胞中主含 allicin", "經壓碎後，產生的獨特味道成分之一為 diallyl disulfide", "具有抗凝血、降血脂、抗菌等作用"],a:1,e:["大蒜為百合科 Allium sativum，用鱗莖。", "完整細胞中主含無臭的 alliin，經壓碎後 alliinase 作用才生成 allicin，此敘述為錯誤。", "大蒜獨特氣味來自 allicin 及其分解產物（如 diallyl disulfide）。", "大蒜具抗凝血、降血脂、抗菌作用。"]},
{c:"配醣體",q:"大蒜中具有抑制血小板凝集作用的主要活性成分之一為何？",o:["(Z)-ajoene", "alliin", "allicin", "allyl isothiocyanate"],a:0,e:["(Z)-ajoene 含 3 個硫原子，由 allicin 形成，抗血小板凝集效果較 E form 好。", "Alliin 為無臭前驅物，經 alliinase 作用成 allicin。", "Allicin 為總活性成分，具抗菌作用。", "Allyl isothiocyanate 為黑芥子的成分。"]},
{c:"配醣體",q:"下列俗名與學名之配對，何者正確？",o:["bitter almond－Prunus armeniaca", "wild cherry－Brassica nigra", "American ginseng－Panax quinquefolius", "cascara sagrada－Rhamnus frangula"],a:2,e:["苦杏仁（apricot pits）為 Prunus armeniaca，bitter almond 為 Prunus dulcis。", "野櫻皮為 Prunus serotina；Brassica nigra 為黑芥子。", "美國人參（花旗參、西洋參）學名為 Panax quinquefolius。", "美鼠李皮為 Rhamnus purshiana；Rhamnus frangula 為歐鼠李皮。"]},
{c:"配醣體",q:"柳樹皮（Salix purpurea）用來治療風濕痛，主要是因為含有下列何種成分？",o:["arbutin", "avenein", "alliin", "salicin"],a:3,e:["Arbutin 為熊果葉的成分。", "Avenein 不是柳樹皮的主要成分。", "Alliin 為大蒜的成分。", "Salicin 為醇類配醣體，水解得 glucose＋saligenin，在體內氧化為 salicylic acid，具抗風濕作用。"]},
{c:"配醣體",q:"製備 salicin 時，加入乙酸鉛以去除單寧後，過剩的鉛離子如何去除？",o:["加入硫化氫", "加入鉻酸", "加入硫酸", "加入氫氧化鈉"],a:0,e:["過剩的 Pb²⁺ 與硫化氫反應生成 PbS 沉澱而去除。", "鉻酸會引入其他重金屬離子。", "加硫酸會生成 PbSO4，但雜質與酸水解可能影響 salicin。", "加氫氧化鈉會使 salicin 變質。"]},
{c:"配醣體",q:"有關 salicylic acid 之敘述，下列何者正確？",o:["僅存在於柳屬（Salix sp.）植物", "為 salicyl alcohol glucoside 之同物異名", "具抗發炎、鎮痛及解熱效果，不會引起口腔、食道、胃之刺激", "可用於製備 aspirin；aspirin 命名之語源來自 acetyl spiraeic acid"],a:3,e:["Salicylic acid 亦存在於繡線菊屬（Spiraea）等植物，並非僅柳屬。", "Salicin 為 salicyl alcohol glucoside，salicylic acid 為其氧化產物，不是同物異名。", "Salicylic acid 有刺激性，口服會刺激胃腸道。", "Salicylic acid 乙醯化得 aspirin；aspirin 命名之語源為 acetyl spiraeic acid，正確。"]},
{c:"配醣體",q:"下列生藥與其藥效成分化學分類之配對，何者錯誤？",o:["senna－anthraquinone glycoside", "aloe－anthraquinone glycoside", "vanilla－aldehyde glycoside", "mustard－phenol glycoside"],a:3,e:["番瀉葉含 sennoside，屬蒽醌類配醣體。", "蘆薈含 aloin，屬蒽醌類（C-glycoside）。", "香莢蘭含 glucovanillin（水解成 vanillin），屬醛類配醣體。", "芥子含 sinigrin/sinalbin，屬異硫氰配醣體（S-glycoside），不是酚類，為錯誤配對。"]},
{c:"配醣體",q:"香莢蘭（vanilla）的基源與矯味成分，下列何者正確？",o:["Vanilla planifolia，蘭科，未成熟果實經 curing 後得 vanillin", "Vanilla planifolia，豆科，成熟種子", "Vanilla tahitensis，茄科，葉", "Vanilla planifolia，菊科，根"],a:0,e:["香莢蘭為蘭科 Vanilla planifolia、V. tahitensis 的未成熟果實；glucovanillin 經 curing（固化）水解成 vanillin（4-hydroxy-3-methoxybenzaldehyde），作矯味劑。", "香莢蘭不屬豆科，用的是果實而非成熟種子。", "香莢蘭不屬茄科，不用葉。", "香莢蘭不屬菊科，不用根。"]},
{c:"配醣體",q:"番紅花（saffron）之藥用部位與其成分 picrocrocin 之水解產物為何？",o:["柱頭；safranal＋glucose", "塊莖；safranal＋rhamnose", "花瓣；vanillin＋glucose", "種子；mandelonitrile＋glucose"],a:0,e:["番紅花（Crocus sativus，鳶尾科）用乾燥花柱柱頭，成分 saffron、picrocrocin（水解得 safranal＋glucose）。", "不用塊莖，水解物也不含 rhamnose。", "不用花瓣，vanillin 為香莢蘭。", "Mandelonitrile 為氰苷的水解產物，與番紅花無關。"]},
{c:"配醣體",q:"熊果葉（uva ursi）所含成分，何者屬於醣苷（glycoside）？",o:["ursolic acid", "ellagic acid", "arbutin", "quercetin"],a:2,e:["Ursolic acid 為三萜酸，非苷。", "Ellagic acid 為酚酸（水解型鞣質水解產物）。", "Arbutin 為 O-glycoside，水解得 hydroquinone＋glucose，作尿道防腐劑。", "Quercetin 為非醣體（flavonol 苷元）。"]},
{c:"配醣體",q:"下列何者為聖約翰草（St John's wort）的主要成分，具抗憂鬱作用？",o:["hypericin", "arbutin", "salicin", "vanillin"],a:0,e:["Hypericum perforatum（金絲桃科）含 hypericin，可抑制 MAO，具抗憂鬱作用。", "Arbutin 為熊果葉成分。", "Salicin 為柳樹皮成分。", "Vanillin 為香莢蘭成分。"]},
{c:"配醣體",q:"下列有關生藥與使用部位及其功用之配對，何者錯誤？",o:["大黃（rheum）－瀉劑－根莖和根", "苦杏仁（apricot pits）－鎮咳－種仁", "毛地黃（digitalis）－強心－根部", "熊果（uva ursi）－收斂－葉部"],a:2,e:["大黃用根莖和根，作瀉劑。", "苦杏仁用種仁，含 amygdalin，鎮咳。", "毛地黃用乾燥葉，不是根部，為錯誤配對。", "熊果用葉部，含 arbutin，具收斂與尿路防腐作用。"]},
{c:"配醣體",q:"Cascaroside A 同時含有 O-及 C-醣苷，其醣基與苷元連接位置分別為何？",o:["C4、C6", "C1、C5", "C1、C9", "C8、C10"],a:3,e:["C4、C6 不是連接位置。", "C1、C5 不是連接位置。", "C1、C9 不是連接位置。", "Cascaroside A 的 O-醣基接在 C8，C-醣基接在 C10，為 O- 與 C-glycoside。"]},
{c:"配醣體",q:"下列何者為 C-glycoside？",o:["sennoside A", "aloin B", "glycyrrhizin", "prunasin"],a:1,e:["Sennoside A 為 O-glycoside。", "Aloin B（isobarbaloin）為 C-glycoside。", "Glycyrrhizin 為 O-glycoside（葡萄糖醛酸）。", "Prunasin 為氰配醣體，O-glycoside。"]},
{c:"配醣體",q:"Prunasin 與 sambunigrin 在化學結構上互為何種關係？",o:["非鏡像異構物", "鏡像異構物", "順式異構物", "反式異構物"],a:0,e:["兩者為氰基碳的異構物（R／S），互為非鏡像（diastereomer）；prunasin 為 (R)-mandelonitrile glucoside。", "兩者具有葡萄糖的不對稱碳，不是完全鏡像。", "順反異構為雙鍵或環的關係，與此無關。", "同上。"]},
{c:"生物鹼",q:"檳榔（Areca）所含 arecoline，具下列何種化學結構？",o:["quinoline", "pyrrolidine", "pyridine-piperidine", "purine"],a:2,e:["Quinoline 見於金雞納生物鹼（quinine）。", "Pyrrolidine 見於 nicotine 的一環。", "Arecoline 為 tetrahydropyridine 結構，屬 pyridine-piperidine 類，前驅物為 lysine。", "Purine 見於咖啡因類。"]},
{c:"生物鹼",q:"下列何者不屬於 pyridine-piperidine alkaloids？",o:["putrescine", "lobeline", "arecoline", "nicotine"],a:0,e:["Putrescine（腐胺）為一種有機化合物，是蛋白質胺基酸腐敗分解產物，不是生物鹼，為正確答案。", "Lobeline 屬 piperidine 類。", "Arecoline 屬 pyridine-piperidine 類。", "Nicotine 屬 pyridine-pyrrolidine，仍列於此大類。"]},
{c:"生物鹼",q:"檳榔（Areca catechu）之醫藥用途為何？",o:["驅絛蟲", "戒菸", "止嘔吐", "抗暈眩"],a:0,e:["檳榔種子含 arecoline，作驅絛蟲劑。", "戒菸曾用北美山梗菜（lobeline）。", "止嘔吐不是檳榔用途。", "抗暈眩為 scopolamine。"]},
{c:"生物鹼",q:"北美山梗菜（Lobelia inflata）的最主要生物鹼 lobeline，其化學結構屬於何者？",o:["pyridine", "piperidine", "pyrrolidine", "quinoline"],a:1,e:["Pyridine 為芳香環，lobeline 為還原型。", "Lobeline 含 N-甲基 piperidine 環，屬 piperidine 類，曾用於戒菸、催吐與治氣喘。", "Pyrrolidine 為 nicotine 的一環。", "Quinoline 為金雞納生物鹼結構。"]},
{c:"生物鹼",q:"Anabasine（新菸鹼）的結構由何種環所組成？",o:["pyridine＋piperidine", "pyridine＋pyrrolidine", "piperidine＋pyrrolidine", "pyridine＋imidazole"],a:0,e:["Anabasine 由 pyridine＋piperidine 組成。", "Pyridine＋pyrrolidine 為 nicotine。", "Piperidine＋pyrrolidine 縮合為 tropane 類。", "Pyridine＋imidazole 不是菸葉生物鹼的組成。"]},
{c:"生物鹼",q:"毛果芸香鹼（pilocarpine）之生合成前驅物為何？",o:["Histidine", "Tryptophan", "Tyrosine", "Lysine"],a:0,e:["Pilocarpine 屬 imidazole 類，前驅物為 histidine。", "Tryptophan 為 indole、quinoline 類前驅物。", "Tyrosine 為 isoquinoline 類前驅物。", "Lysine 為 piperidine 類前驅物。"]},
{c:"生物鹼",q:"下列有關 pilocarpine 之敘述，何者正確？",o:["分子中含 lactone 環與 imidazole 環", "為抗膽鹼藥，與 atropine 作用相同", "儲存二年後效價不變", "來自茄科植物"],a:0,e:["Pilocarpine 含五員 lactone 環與 imidazole 環；在鹼中內酯環水解成 pilocarpic acid 而失效。", "Pilocarpine 直接作用於 muscarinic 受體，作用與 atropine 相反（縮瞳）。", "儲存一年效價僅剩一半，兩年後幾乎失效。", "基源 Pilocarpus jaborandi 屬芸香科，用小葉。"]},
{c:"生物鹼",q:"下列有關 reserpine 之敘述，何者正確？",o:["為 diester 類，D/E 環為 cis 連接", "含 3 個不對稱中心", "水解得 quinic acid", "主要來自 Rauvolfia 的葉"],a:0,e:["Reserpine 屬 diester，D/E 環順式連接，具 6 個不對稱中心；水解得 reserpic acid、methanol 與 3,4,5-trimethoxybenzoic acid。", "不對稱中心為 6 個，不是 3 個。", "水解產物不是 quinic acid。", "藥用部位為根（夾竹桃科 Rauvolfia serpentina），不是葉。"]},
{c:"生物鹼",q:"Vinblastine 與 vincristine 之比較，下列何者正確？",o:["vincristine 具 N-CHO，治急性淋巴性白血病，副作用為神經毒性", "vinblastine 具 N-CHO，副作用為神經毒性", "兩者結構皆含 2 個 N", "兩者作用於細胞週期 S 期"],a:0,e:["Vincristine（N-CHO）用於急性淋巴性白血病，主要副作用為神經毒性；vinblastine（N-CH3）用於 Hodgkin's disease，副作用為骨髓抑制。", "N-CHO 為 vincristine，N-CH3 為 vinblastine。", "兩者皆為 bisindole 結構，共含 4 個 N。", "兩者抑制微管聚合，使細胞停留在 M 期。"]},
{c:"生物鹼",q:"下列何者為麥角（ergot）之水溶性、非胜肽類生物鹼？",o:["ergotamine", "ergonovine（ergometrine）", "ergotoxine", "ergocristine"],a:1,e:["Ergotamine 為非水溶性胜肽類，含 5 個 N，用於偏頭痛。", "Ergonovine 為水溶性、非胜肽類，含 3 個 N，用於子宮收縮、催產。", "Ergotoxine 為胜肽類混合物。", "Ergocristine 為胜肽類，屬 ergotoxine 成分之一。"]},
{c:"生物鹼",q:"下列有關麥角（ergot）之敘述，何者錯誤？",o:["lysergic acid 生合成之前驅物之一為 tryptophan", "藥用部位為菌核", "lysergic acid diethylamide 具有迷幻作用", "ergotamine 為水溶性生物鹼"],a:3,e:["麥角酸由 tryptophan 與 dimethylallyl pyrophosphate（DMAPP）而來。", "麥角菌（Claviceps purpurea）寄生於裸麥，藥用菌核。", "LSD 為麥角酸的半合成品，具迷幻作用。", "Ergotamine 為非水溶性胜肽類，為錯誤敘述。"]},
{c:"生物鹼",q:"育亨賓（Yohimbe）樹皮所含 yohimbine，傳統上用於何種治療？",o:["陽痿", "高血壓", "瘧疾", "青光眼"],a:0,e:["Yohimbine 活化副交感神經，具壯陽與興奮功效，用於治療血管性與糖尿病所引起的陽痿。", "降血壓為 reserpine。", "瘧疾為 quinine。", "青光眼為 pilocarpine、physostigmine。"]},
{c:"生物鹼",q:"番木鱉（Nux vomica）的科別與主要成分為何？",o:["馬錢科；strychnine、brucine", "茜草科；quinine", "毛茛科；aconitine", "夾竹桃科；reserpine"],a:0,e:["Strychnos nux-vomica 為馬錢科 Loganiaceae，種子含 strychnine（中樞興奮）與 brucine（酒精變性劑）。", "茜草科為金雞納、吐根。", "毛茛科為烏頭、黃連。", "夾竹桃科為蛇根木、長春花。"]},
{c:"生物鹼",q:"毒扁豆（Calabar bean）的基源植物為何？",o:["Strychnos ignatia", "Physostigma venenosum", "Pilocarpus microphyllus", "Aconitum napellus"],a:1,e:["Strychnos ignatii 為解熱豆，馬錢科。", "毒扁豆（Physostigma venenosum，豆科）種子含 physostigmine（eserine）。", "Pilocarpus microphyllus 為毛果芸香，芸香科。", "Aconitum napellus 為烏頭，毛茛科。"]},
{c:"生物鹼",q:"Physostigmine 保存不當會使顏色變紅，係因水解及氧化形成何種化合物？",o:["rubreserine", "eseramine", "physovenine", "geneserine"],a:0,e:["Physostigmine 水解成 eseroline，再氧化成紅色的 rubreserine，使藥效喪失。", "Eseramine 為毒扁豆的其他生物鹼。", "Physovenine 為毒扁豆的其他生物鹼。", "Geneserine 為 physostigmine 的 N-氧化物，非紅色變質物。"]},
{c:"生物鹼",q:"Physostigmine 的藥理作用為何？",o:["抑制膽鹼酯酶，可縮瞳並治青光眼", "阻斷 muscarinic 受體", "抑制 MAO", "抑制 Na⁺,K⁺-ATPase"],a:0,e:["Physostigmine（eserine）為可逆性膽鹼酯酶抑制劑，減少 ACh 分解，縮瞳，治青光眼，並可解抗膽鹼藥中毒。", "阻斷 muscarinic 受體是 atropine 的作用。", "抑制 MAO 如聖約翰草 hypericin。", "抑制 Na⁺,K⁺-ATPase 是強心苷作用。"]},
{c:"生物鹼",q:"Quinine 與 quinidine 的結構中，兩個氮原子皆來自何者？",o:["同一個 tryptophan", "兩個不同的 tryptophan", "phenylalanine", "ornithine"],a:0,e:["Quinine 類為 tryptophan 與 secologanin（單萜）合成，兩個氮原子皆來自同一個 tryptophan。", "不是兩個 tryptophan，那是 vinblastine 類雙聚體。", "Phenylalanine 為 tropane、ephedrine 類前驅物。", "Ornithine 為 tropane、nicotine 類前驅物。"]},
{c:"生物鹼",q:"金雞納（Cinchona）樹皮的水溶液加溴試液及氨試液，呈現翠綠色，此檢驗法稱為？",o:["thalleioquin test", "Dragendorff test", "Mayer test", "Fehling test"],a:0,e:["Thalleioquin test 用於 quinine 與 quinidine（加溴與氨水呈翠綠色）。", "Dragendorff 為一般生物鹼試劑。", "Mayer 為一般生物鹼沉澱試劑。", "Fehling 檢測還原糖。"]},
{c:"生物鹼",q:"下列金雞納生藥之基源與主成分，何者配對正確？",o:["Cinchona succirubra（紅金雞納）－cinchonidine", "Cinchona ledgeriana（黃金雞納）－cinchonidine", "Remijia pedunculata（銅色金雞納）－quinine", "Cinchona calisaya－quinidine"],a:0,e:["紅金雞納（C. succirubra）主成分為 cinchonidine。", "黃金雞納（ledgeriana、calisaya）主成分為 quinine。", "銅色金雞納（Remijia pedunculata）主成分為 quinidine。", "C. calisaya 為黃色，主成分是 quinine。"]},
{c:"生物鹼",q:"下列有關生物鹼檢測試劑，何者錯誤？",o:["與碘化鉍鉀試劑（Dragendorff）作用呈現深藍色", "加入過氯酸鈉會產生白色沉澱", "和雷氏鹽（Reinecke's salt）作用會產生沉澱", "三級生物鹼可應用酸鹼處理得到該類成分"],a:0,e:["Dragendorff 試劑與生物鹼生成橘紅色沉澱，不是深藍色，為錯誤敘述。", "生物鹼加過氯酸鈉可形成白色沉澱。", "雷氏鹽可使生物鹼產生沉澱。", "生物鹼利用酸鹼溶解度差異，可以酸鹼處理萃取。"]},
{c:"生物鹼",q:"下列何者在常溫下呈液態？",o:["nicotine", "cocaine", "hydrastine", "atropine"],a:0,e:["Nicotine 為液態（不含氧）。", "Cocaine 為結晶固體。", "Hydrastine 為結晶固體。", "Atropine 為結晶固體。"]},
{c:"生物鹼",q:"下列何者屬於 non-heterocyclic alkaloid？",o:["cocaine", "quinine", "ephedrine", "berberine"],a:2,e:["Cocaine 為 tropane 類，N 在環上。", "Quinine 為 quinoline 類，N 在環上。", "Ephedrine（麻黃鹼）的氮在側鏈上，屬非雜環生物鹼（alkaloidal amine）。", "Berberine 為 isoquinoline 類，N 在環上。"]},
{c:"生物鹼",q:"(－)-Scopolamine 相較於 (－)-hyoscyamine 之結構，有何差異？",o:["多一個 epoxide", "少一個 epoxide", "少一個 N-methyl", "多一個 2-carbomethoxy"],a:0,e:["Scopolamine 的 pyrrolidine 環上有 6,7-epoxide，hyoscyamine 沒有。", "少一個 epoxide 是 hyoscyamine 相對於 scopolamine 的差異，方向相反。", "兩者皆有 N-methyl。", "2-carbomethoxy 是 cocaine 的結構，不是兩者之差異。"]},
{c:"生物鹼",q:"N-Methylpyrrolinium ion 為 nicotine 生合成之重要中間體，其前驅物為何？",o:["lysine", "glycine", "ornithine", "phenylalanine"],a:2,e:["Lysine 為 piperidine 類前驅物。", "Glycine 為嘌呤類的來源。", "Ornithine 經 putrescine 形成 N-methylpyrrolinium ion，為 pyrrolidine 環來源。", "Phenylalanine 為 tropic acid、ephedrine 前驅物。"]},
{c:"生物鹼",q:"有關古柯鹼（cocaine）之敘述，下列何者錯誤？",o:["其骨架屬於 tropane 類", "具有雙酯結構（diester）", "具有局部麻醉作用", "benzaldehyde 為其水解產物之一"],a:3,e:["Cocaine 屬 tropane 類（ecgonine 衍生物）。", "Cocaine 含 2-carbomethoxy 與 3-benzoyloxy 兩個酯基。", "Cocaine 具局部麻醉作用。", "Cocaine 水解得 ecgonine、methanol、benzoic acid，不產生 benzaldehyde，為錯誤敘述。"]},
{c:"生物鹼",q:"古柯葉所含之 tropacocaine，屬於下列何種型式之生物鹼？",o:["ecgonine type", "tropine type", "hygrine type", "indolizidine type"],a:1,e:["Ecgonine type 以 cocaine 為代表。", "Tropacocaine、valerine 為 tropine type（顛茄酚衍生物）。", "Hygrine type 為 hygroline、cuscohygrine。", "Indolizidine type 不是古柯的生物鹼類型。"]},
{c:"生物鹼",q:"下列有關生藥之別名配對，何者錯誤？",o:["physostigma－ordeal bean", "hydrastis－goldenseal", "stramonium－jaborandi", "sanguinaria－bloodroot"],a:2,e:["毒扁豆別名神判豆（ordeal bean）。", "北美黃連別名 goldenseal。", "曼陀羅（stramonium）別名 thornapple、Jimson weed；jaborandi 為毛果芸香，為錯誤配對。", "血根別名 bloodroot。"]},
{c:"生物鹼",q:"下列生藥過量使用會造成視聽障礙者為何？",o:["cinchona", "coca", "stramonium", "hydrastis"],a:0,e:["金雞納過量（quinine）可造成耳鳴、聽力與視力受損（cinchonism）。", "古柯過量為興奮、幻覺。", "曼陀羅過量為散瞳、口乾、幻覺。", "北美黃連過量為黏膜刺激。"]},
{c:"生物鹼",q:"下列何者不屬於 tropine 之衍生物？",o:["hyoscyamine", "atropine", "scopolamine", "hygroline"],a:3,e:["Hyoscyamine 為 tropine 與 tropic acid 之酯。", "Atropine 為 dl-hyoscyamine。", "Scopolamine 為含環氧的 tropane 酯。", "Hygroline 屬 hygrine 衍生物，不是 tropine 衍生物，為正確答案。"]},
{c:"生物鹼",q:"咖啡因（caffeine）結構中，C4、C5、N7 在生合成中的來源為何？",o:["glycine", "glutamine", "aspartic acid", "CO₂"],a:0,e:["Purine 生合成中 C4、C5、N7 來自 glycine。", "N3、N9 來自 glutamine。", "N1 來自 aspartic acid。", "C6 來自 CO₂。"]},
{c:"生物鹼",q:"烘焙咖啡豆時產生的特殊咖啡芳香，係來自下列何者？",o:["palmitin", "trigonelline", "caffeol", "caffeine"],a:2,e:["Palmitin 為脂質，非芳香成分。", "Trigonelline 為生物鹼，與烘焙香氣不直接相關。", "烘焙後產生香味的是 caffeol（含 furfurol）。", "Caffeine 為咖啡因，苦味，無香氣。"]},
{c:"生物鹼",q:"茶葉中的 tannin，其含量最高的成分為何？",o:["gallotannic acid", "catechin", "ellagic acid", "chlorogenic acid"],a:0,e:["茶葉含 Tannin（gallotannic acid 含量最高），具收斂作用。", "Catechin 為縮合型單位，含量次之。", "Ellagic acid 非茶葉主要 tannin。", "Chlorogenic acid 為咖啡酸衍生物。"]},
{c:"生物鹼",q:"下列何者屬於 phthalideisoquinoline 類生物鹼？",o:["hydrastine", "physostigmine", "brucine", "physovenine"],a:0,e:["Hydrastine（北美黃連）含 γ-lactone，屬 phthalideisoquinoline 類。", "Physostigmine 為 indole 類。", "Brucine 為 indole 類。", "Physovenine 為毒扁豆的其他生物鹼，非 phthalideisoquinoline。"]},
{c:"生物鹼",q:"下列生物鹼，何者不是分離自北美黃連（goldenseal）？",o:["hydrastine", "berberine", "canadine", "cephaeline"],a:3,e:["Hydrastine 為其主成分。", "Berberine 為其成分。", "Canadine 為其成分。", "Cephaeline 為吐根（ipecac）的生物鹼，為正確答案。"]},
{c:"生物鹼",q:"下列何者為血根（bloodroot）的基源植物？",o:["Sanguinaria canadensis", "Cephaelis ipecacuanha", "Hydrastis canadensis", "Strychnos castelnaei"],a:0,e:["血根為罌粟科 Sanguinaria canadensis，根莖含 sanguinarine，用於牙膏與漱口水。", "Cephaelis ipecacuanha 為吐根。", "Hydrastis canadensis 為北美黃連。", "Strychnos castelnaei 為箭毒。"]},
{c:"生物鹼",q:"下列何者不是箭毒（curare）的植物基源？",o:["Strychnos toxifera", "Strychnos nux-vomica", "Strychnos castelnaei", "Strychnos crevauxii"],a:1,e:["Strychnos toxifera 為箭毒基源。", "Strychnos nux-vomica 為番木鱉，含 strychnine，不是箭毒基源，為正確答案。", "Strychnos castelnaei 為箭毒基源。", "Strychnos crevauxii 為箭毒基源。"]},
{c:"生物鹼",q:"d-Tubocurarine 在生合成上之前驅物為何？",o:["anthranilic acid", "histidine", "lysine", "tyrosine"],a:3,e:["Anthranilic acid 為 quinoline、indole 的前驅物。", "Histidine 為 pilocarpine 的前驅物。", "Lysine 為 piperidine 類前驅物。", "Tubocurarine 為 bisbenzylisoquinoline，由 4 個 tyrosine 衍生。"]},
{c:"生物鹼",q:"下列何種中藥不含 berberine？",o:["黃柏", "黃耆", "黃連", "黃皮樹"],a:1,e:["黃柏（Phellodendron）含 berberine。", "黃耆為補氣藥，不含 berberine，為正確答案。", "黃連含 berberine、coptisine。", "黃皮樹為黃柏基源之一，含 berberine。"]},
{c:"生物鹼",q:"清熱藥黃柏（Phellodendri Cortex）中生物鹼 phellodendrine 之骨架為何？",o:["quinoline", "isoquinoline", "pyridine-piperidine", "purine"],a:1,e:["Quinoline 為金雞納類。", "Phellodendrine 與 berberine 同屬 isoquinoline 類，基源為芸香科黃檗，用樹皮。", "Pyridine-piperidine 為檳榔鹼等。", "Purine 為咖啡因類。"]},
{c:"生物鹼",q:"吐根（ipecac）中，cephaeline 經甲基化後可形成何者？",o:["emetine", "psychotrine", "berberine", "hydrastine"],a:0,e:["吐根鹼 emetine 為 cephaeline 的 O-甲基化產物，催吐作用較強，亦用於阿米巴痢疾。", "Psychotrine 為吐根微鹼，為另一生物鹼。", "Berberine 為黃連、黃柏成分。", "Hydrastine 為北美黃連成分。"]},
{c:"生物鹼",q:"嗎啡的生合成順序，下列何者正確？",o:["thebaine→codeinone→codeine→morphine", "codeine→thebaine→codeinone→morphine", "morphine→codeine→thebaine", "codeinone→thebaine→morphine→codeine"],a:0,e:["生合成順序為 thebaine→codeinone→codeine→morphine（逐步去甲基與還原）。", "codeine 不是 thebaine 的前驅物。", "順序顛倒。", "codeinone 在 thebaine 之後。"]},
{c:"生物鹼",q:"大紅罌粟（Papaver bracteatum）為何只產生高量 thebaine？",o:["缺乏去甲基（demethylation）", "缺乏羥基化", "缺乏乙醯化", "缺乏氧化酚性偶合"],a:0,e:["大紅罌粟因無法去甲基，生合成停在 thebaine，又稱產生蒂巴因的罌粟，可供半合成 codeine。", "羥基化缺乏不是主因。", "乙醯化與 thebaine 累積無關。", "氧化酚性偶合發生在 salutaridine 形成階段，不是缺乏的步驟。"]},
{c:"生物鹼",q:"下列 isoquinoline 成分與其次分類（subgroup）之配對，何者錯誤？",o:["papaverine－benzylisoquinoline", "tubocurarine－benzophenanthridine", "hydrastine－phthalideisoquinoline", "thebaine－morphinan"],a:1,e:["Papaverine 為 benzylisoquinoline。", "Tubocurarine 為 bisbenzylisoquinoline（benzylisoquinoline 類），不是 benzophenanthridine（如 sanguinarine），為錯誤配對。", "Hydrastine 為 phthalideisoquinoline。", "Thebaine 為 morphinan。"]},
{c:"萜類與揮發油",q:"下列有關樟腦（camphor）之敘述，何者錯誤？",o:["為醇類化合物", "天然產者為右旋性", "pinene 可為合成 camphor 之原料", "低濃度時可當局部止癢劑"],a:0,e:["Camphor 為雙環單萜的酮類（ketone），不是醇類，為錯誤敘述。", "天然樟腦（Cinnamomum camphora，樟科）為右旋，旋光度約 +41° 至 +43°；合成者無旋光。", "Pinene 經 bornyl ester、isoborneol 可合成 camphor；borneol 氧化亦得 camphor。", "0.1～2% 可作局部止癢劑，11% 可作抗刺激劑。"]},
{c:"萜類與揮發油",q:"下列何者為 thymol 之敘述？",o:["屬酚類，苯環接羥基，可經氫化得 menthol", "屬醇類", "屬酮類", "屬醚類"],a:0,e:["Thymol（麝香草酚）為單環單萜酚類，具抗菌、漱口水用途，氫化（還原）可形成 menthol。", "Menthol 才是醇類。", "酮類如 camphor。", "醚類如 cineole（eucalyptol）。"]},
{c:"萜類與揮發油",q:"麝香草酚（thymol）非下列何種基源植物之主要藥效成分？",o:["Thymus vulgaris", "Monarda punctata", "Carum copticum", "Mentha arvensis"],a:3,e:["Thymus vulgaris（百里香）為 thyme oil 來源。", "Monarda punctata（斑點馬薄荷）含 thymol。", "Carum copticum（印度藏茴香）含 thymol。", "Mentha arvensis（薄荷）含 menthol，不是 thymol，為正確答案。"]},
{c:"萜類與揮發油",q:"下列有關桉樹葉（Eucalyptus globulus）主成分 cineole 之敘述，何者錯誤？",o:["為酚類化合物", "為 eucalyptus oil 之主成分", "可作祛痰劑", "又稱 eucalyptol"],a:0,e:["Cineole 為醚類（不是酚類），為錯誤敘述。", "桉油含 70～80% cineole。", "可作祛痰劑與矯味劑。", "Cineole 又稱 eucalyptol。"]},
{c:"萜類與揮發油",q:"Terpin hydrate 的化學類型與用途為何？",o:["醇類（cis-p-menthane-1,8-diol hydrate），祛痰", "酮類，局部止癢", "酚類，漱口", "醚類，矯味"],a:0,e:["Terpin hydrate 為 cis-p-menthane-1,8-diol 的水合物，屬醇類，用作祛痰劑，可由松節油經酸催化水合製得。", "酮類如 camphor。", "酚類如 thymol。", "醚類如 cineole。"]},
{c:"萜類與揮發油",q:"下列何者具有 internal peroxide linkage（內過氧橋）？",o:["forskolin", "artemisinin", "santonin", "parthenolide"],a:1,e:["Forskolin 為 labdane 雙萜。", "Artemisinin 含 endoperoxide 橋，是抗瘧活性必需基團。", "Santonin 為 eudesmanolide，無過氧橋。", "Parthenolide 為 germacranolide，含環氧，不是過氧橋。"]},
{c:"萜類與揮發油",q:"青蒿素（artemisinin）屬於下列何種類型之萜類？",o:["monoterpene", "sesquiterpene", "diterpene", "triterpene"],a:1,e:["Monoterpene 為 C10。", "Artemisinin 為 C15 的倍半萜內酯，水溶性差。", "Diterpene 為 C20（如 taxol、ginkgolide）。", "Triterpene 為 C30。"]},
{c:"萜類與揮發油",q:"纈草（Valeriana officinalis）所含 valepotriates 屬於何種化合物？",o:["倍半萜", "iridoid 類", "單萜", "雙萜"],a:1,e:["倍半萜類為 valerenic acid 等成分。", "Valepotriates 屬 iridoid 類，不是倍半萜；纈草抗焦慮、輔助睡眠。", "單萜類如 bornyl acetate（揮發油成分）不是 valepotriates。", "雙萜類不是纈草的主要成分。"]},
{c:"萜類與揮發油",q:"下列何者具有抗焦慮及幫助睡眠之作用？",o:["Tanacetum parthenium", "Matricaria recutita", "Valeriana officinalis", "Coleus forskohlii"],a:2,e:["Tanacetum parthenium（小白菊）預防偏頭痛。", "Matricaria recutita（洋甘菊）消炎、抗痙攣。", "纈草（敗醬科，用根莖與根）抗焦慮、輔助睡眠。", "Coleus forskohlii 含 forskolin，用於心肌病變、青光眼。"]},
{c:"萜類與揮發油",q:"山道年（santonin）屬於下列何種倍半萜內酯骨架？",o:["germacranolide", "guaianolide", "eudesmanolide", "xanthanolide"],a:2,e:["Germacranolide 為十元環（如 parthenolide）。", "Guaianolide 為五＋七元環（如 matricin）。", "Santonin（Artemisia cina 花）屬 eudesmanolide（六＋六元環），用作驅蟲藥。", "Xanthanolide 為另一類倍半萜內酯。"]},
{c:"萜類與揮發油",q:"小白菊（feverfew）所含 parthenolide 屬於何種骨架，其主要用途為何？",o:["germacranolide；預防偏頭痛", "guaianolide；驅蟲", "eudesmanolide；抗瘧", "labdane；治青光眼"],a:0,e:["Parthenolide 為 germacranolide（十元環），可抑制血小板 serotonin 釋放，退燒並減少偏頭痛發作頻率。", "Guaianolide 如 matricin（洋甘菊）。", "Eudesmanolide 如 santonin。", "Labdane 為 forskolin 的骨架。"]},
{c:"萜類與揮發油",q:"洋甘菊（Matricaria recutita）所含 matricin 屬何種骨架？",o:["guaianolide", "germacranolide", "eudesmanolide", "xanthanolide"],a:0,e:["Matricin 為 guaianolide（五＋七元環），洋甘菊花含 bisabolol 與 matricin，具消炎、抗痙攣。", "Germacranolide 為十元環。", "Eudesmanolide 為六＋六元環。", "Xanthanolide 不是洋甘菊的主要類型。"]},
{c:"萜類與揮發油",q:"Forskolin（毛喉素）屬於何種類型之萜類？",o:["sesquiterpene", "labdane 型雙萜", "triterpene", "monoterpene"],a:1,e:["倍半萜為 C15，forskolin 非此類。", "Forskolin 為 Coleus forskohlii 根部的 labdane 型雙萜，可活化 adenylate cyclase，使 cAMP 增加。", "Triterpene 為 C30。", "Monoterpene 為 C10。"]},
{c:"萜類與揮發油",q:"Forskolin 之主要藥理作用機轉為何？",o:["活化 adenylate cyclase，使 cAMP 增加", "抑制血小板活化因子（PAF）", "抑制微管蛋白聚合", "抑制 Na⁺,K⁺-ATPase"],a:0,e:["Forskolin 活化 adenylate cyclase，增加 cAMP，用於心肌病變、氣喘、青光眼與高血壓。", "抑制 PAF 為銀杏內酯。", "穩定微管為 taxol。", "抑制 Na⁺,K⁺-ATPase 為強心苷。"]},
{c:"萜類與揮發油",q:"銀杏內酯（ginkgolide）之敘述，下列何者正確？",o:["為含 3 個 lactone 的雙萜，可抑制血小板活化因子（PAF）", "為倍半萜類", "主要來自銀杏的根", "為 flavonoid 類"],a:0,e:["Ginkgolide A、B、C、J、M 為含三個 lactone 的雙萜，可抑制 PAF、改善血液循環。", "不是倍半萜，而是 diterpene。", "銀杏藥用部位為乾燥葉。", "Flavonoid 為另一類成分（flavone glycoside 約 24%）。"]},
{c:"萜類與揮發油",q:"有關 taxol（paclitaxel）之敘述，下列何者正確？",o:["可穩定微管蛋白（tubulin）聚合，使細胞週期停滯於 G2、M 期", "主要來自 Taxus brevifolia 的葉", "為倍半萜類", "其 C-13 酯鏈對活性無影響"],a:0,e:["Taxol 促進並穩定微管蛋白聚合，抑制細胞週期於 G2、M 期，為抗腫瘤藥（卵巢癌、乳癌）。", "Taxus brevifolia 的樹皮為來源，針狀葉含 10-deacetylbaccatin III，可半合成。", "Taxol 為雙萜類（taxane 骨架）。", "C-13 酯鏈是活性必需。"]},
{c:"萜類與揮發油",q:"10-deacetylbaccatin III 為 taxol 半合成原料，其主要來源為何？",o:["歐洲紫杉（Taxus baccata）針狀葉", "太平洋紫杉樹皮", "銀杏葉", "山道年花"],a:0,e:["歐洲紫杉的針狀葉含 10-DAB III，可再生而不必砍樹，用於半合成 paclitaxel。", "太平洋紫杉（Taxus brevifolia）樹皮含 taxol，但來源有限。", "銀杏葉含 ginkgolide，與 taxol 無關。", "山道年為驅蟲藥。"]},
{c:"萜類與揮發油",q:"印度楝（Azadirachta indica）所含 azadirachtin 之用途為何？",o:["昆蟲拒食劑（insect antifeedant）", "祛痰劑", "抗瘧", "強心"],a:0,e:["Azadirachtin（楝科）為 limonoid 類，可作昆蟲拒食劑與植物殺蟲劑。", "祛痰如 terpin hydrate、cineole。", "抗瘧如 artemisinin、quinine。", "強心如強心苷。"]},
{c:"萜類與揮發油",q:"類胡蘿蔔素（carotenoids）由幾個 isoprene 所組成，屬於何類？",o:["8 個 isoprene，四萜（C40）", "6 個 isoprene，三萜", "4 個 isoprene，雙萜", "2 個 isoprene，單萜"],a:0,e:["Carotenoids 為四萜（C40），多為黃、紅色素，具光保護、抗氧化，亦為 vitamin A 前驅物。", "三萜為 6 個 isoprene（C30）。", "雙萜為 4 個 isoprene。", "單萜為 2 個 isoprene。"]},
{c:"萜類與揮發油",q:"缺乏維生素 A（vitamin A）時，容易導致下列何種症狀？",o:["夜盲症", "佝僂病", "壞血病", "腳氣病"],a:0,e:["Vitamin A（all-trans retinol）缺乏會導致夜盲症、乾眼症、抵抗力下降。", "佝僂病為缺乏 vitamin D。", "壞血病為缺乏 vitamin C。", "腳氣病為缺乏 vitamin B1。"]},
{c:"萜類與揮發油",q:"isotretinoin 用於治療嚴重粉刺，下列何者為其重要禁忌？",o:["孕婦（可能導致畸胎）", "兒童", "老年人", "糖尿病"],a:0,e:["Isotretinoin（13-cis retinoic acid）有致畸性，孕婦禁用。", "兒童並非主要禁忌。", "老年人並非主要禁忌。", "糖尿病並非主要禁忌。"]},
{c:"萜類與揮發油",q:"Tretinoin 與 isotretinoin 的結構關係為何？",o:["all-trans retinoic acid 與其 13-cis 異構物", "皆為 retinol", "皆為 β-carotene", "皆為 lycopene"],a:0,e:["Tretinoin 為 all-trans retinoic acid（增加表皮細胞分裂與代謝，治療痤瘡），isotretinoin 為 13-cis 異構物。", "Retinol 為醇，不是酸。", "β-carotene 為 provitamin A。", "Lycopene 為番茄紅素，不含 β-ionone 環。"]},
{c:"萜類與揮發油",q:"有關丁香（clove）之敘述，下列何者錯誤？",o:["基源植物之科名為 Myricaceae", "使用部位為乾燥花蕾", "clove 來自拉丁文 clavus（釘子）的字意", "主成分為 eugenol，可作牙科鎮痛劑"],a:0,e:["丁香（Eugenia caryophyllus）為桃金孃科 Myrtaceae，不是楊梅科 Myricaceae，為錯誤敘述。", "藥用部位為乾燥花蕾（花苞）。", "Clove 一詞源自拉丁文 clavus，指花蕾形似釘子。", "丁香油主成分 eugenol（酚類），用於牙科止痛、填充劑，比重大於水。"]},
{c:"萜類與揮發油",q:"下列何者為 clove oil 之主成分 eugenol 之化學類型？",o:["酚類", "醇類", "酮類", "醚類"],a:0,e:["Eugenol 為苯環接羥基的酚類，亦存在於桂皮油，可合成 vanillin。", "醇類如 menthol、terpin hydrate。", "酮類如 camphor、carvone。", "醚類如 cineole。"]},
{c:"萜類與揮發油",q:"桂皮油（cassia oil）之主成分為何？",o:["cinnamic aldehyde", "eugenol", "menthol", "safrole"],a:0,e:["中國桂皮（Cinnamomum cassia，樟科）桂皮油主成分為 cinnamic aldehyde（桂皮醛），易氧化成 cinnamic acid。", "Eugenol 為丁香油主成分。", "Menthol 為薄荷油主成分。", "Safrole 為黃樟油、肉豆蔻成分。"]},
{c:"萜類與揮發油",q:"肉豆蔻（nutmeg）揮發油之製備方法為何？",o:["直接蒸氣蒸餾法", "壓榨法", "油脂吸附法", "埃庫爾冷壓法"],a:0,e:["肉豆蔻油（以及薄荷油、桂皮油）以直接蒸氣蒸餾法製備。", "壓榨法用於檸檬油、橙油。", "油脂吸附法（enfleurage）用於玫瑰油。", "Ecuelle 法用於柑橘類果皮。"]},
{c:"萜類與揮發油",q:"肉豆蔻服用大量（15 g 以上）可產生迷幻作用，主要與下列何者有關？",o:["myristicin 與 elemicin 在體內代謝成類安非他命化合物", "menthol 的中樞抑制", "eugenol 的麻醉", "cinnamic aldehyde 的興奮"],a:0,e:["肉豆蔻（Myristica fragrans）所含 myristicin（酚醚類）、elemicin 在體內代謝成 amphetamine-like 化合物，興奮中樞神經，safrole 則易致癌。", "Menthol 為薄荷成分，不含迷幻作用。", "Eugenol 為丁香成分，具止痛作用。", "桂皮醛無迷幻作用。"]},
{c:"萜類與揮發油",q:"薄荷屬植物（peppermint）生合成 menthol 的過程中，(－)-(4S)-limonene 需於第幾位碳進行羥基化反應？",o:["C-2", "C-3", "C-5", "C-6"],a:1,e:["C-2 不是羥基化位置。", "(－)-Limonene 經 C-3 羥基化，形成 trans-isopiperitenol，再經多步反應得 (－)-menthol。", "C-5 不是羥基化位置。", "C-6 不是羥基化位置。"]},
{c:"萜類與揮發油",q:"薄荷油（peppermint oil）主要利用下列何種方法提取？",o:["直接蒸氣蒸餾法", "壓榨法", "油脂吸附法", "埃庫爾冷壓法"],a:0,e:["薄荷油為全草、地上部直接蒸氣蒸餾所得，主成分 (－)-menthol。", "壓榨法用於柑橘類果皮油。", "Enfleurage 用於玫瑰、茉莉。", "Ecuelle 用於柑橘果皮冷壓。"]},
{c:"萜類與揮發油",q:"綠薄荷油（spearmint oil）所含的主要成分為何？",o:["(－)-carvone（l-carvone）", "(＋)-carvone", "menthol", "thymol"],a:0,e:["Spearmint（Mentha spicata）主成分為 (－)-carvone，作矯味、祛風。", "(＋)-Carvone（d-carvone）來自藏茴香（caraway）。", "Menthol 為薄荷（peppermint）成分。", "Thymol 為百里香成分。"]},
{c:"萜類與揮發油",q:"d-carvone 可由下列何者提取？",o:["caraway", "fennel", "lavender oil", "eucalyptus oil"],a:0,e:["藏茴香（Carum carvi）含 (＋)-carvone（d-carvone）。", "小茴香（Foeniculum vulgare）主成分為 (E)-anethole。", "薰衣草油主成分為 linalyl acetate。", "桉樹油主成分為 cineole。"]},
{c:"萜類與揮發油",q:"下列何者之基源植物不屬於繖形科（Apiaceae）？",o:["Lavandula angustifolia", "Carum carvi", "Pimpinella anisum", "Foeniculum vulgare"],a:0,e:["薰衣草（Lavandula angustifolia）為唇形科 Lamiaceae，為正確答案。", "Carum carvi（藏茴香）為繖形科。", "Pimpinella anisum（洋茴香）為繖形科。", "Foeniculum vulgare（小茴香）為繖形科。"]},
{c:"萜類與揮發油",q:"冬青油（wintergreen oil）的主成分為 methyl salicylate，其基源植物與使用部位為何？",o:["Gaultheria procumbens；葉", "Pinus palustris；針葉", "Eucalyptus globulus；根", "Cinnamomum camphora；樹皮"],a:0,e:["冬青油取自杜鵑花科（石南科）Gaultheria procumbens 的葉；亦可由樺木科 Betula lenta 樹皮得到，主成分 methyl salicylate，抗刺激、消炎。", "Pinus palustris 為松節油來源。", "Eucalyptus globulus 為桉樹油（取葉）。", "Cinnamomum camphora 為樟腦來源。"]},
{c:"萜類與揮發油",q:"揮發油中的芳香族化合物，是經由下列何種生合成路徑而成？",o:["shikimic acid-phenylpropanoid pathway", "acetate-mevalonic acid pathway", "acetate-malonic acid pathway", "amino acid pathway"],a:0,e:["芳香族揮發油（冬青油、肉豆蔻油、洋茴香油、小茴香）經莽草酸-苯丙烷途徑。", "Acetate-mevalonate 為萜類揮發油（薄荷、檸檬、松節油）。", "Acetate-malonate 產生脂肪酸、蒽醌。", "Amino acid 路徑產生生物鹼。"]},
{c:"萜類與揮發油",q:"下列何者不屬於揮發油（volatile oils）？",o:["eucalyptus oil", "pine oil", "fennel oil", "sesame oil"],a:3,e:["桉樹油為揮發油。", "松油為揮發油。", "茴香油為揮發油。", "芝麻油為固定油（脂肪酸甘油酯），可皂化，不是揮發油，為正確答案。"]},
{c:"樹脂與脂質",q:"下列何者為油樹脂（oleo-resin）？",o:["turpentine（松節油）", "myrrh", "storax", "benzoin"],a:0,e:["油樹脂為樹脂與揮發油混合物，如薑、松節油。", "Myrrh（沒藥）為油膠樹脂（oleo-gum-resin）。", "Storax（蘇合香）為香膠（balsam）。", "Benzoin（安息香）為香膠。"]},
{c:"樹脂與脂質",q:"下列生藥類別配對，何者錯誤？",o:["rosin－resin", "turpentine－oleoresin", "storax－oleo-gum-resin", "benzoin－balsam"],a:2,e:["松香為樹脂類。", "松節油為油樹脂。", "蘇合香（storax）為香膠（balsam），含 cinnamic acid、benzoic acid，不是油膠樹脂，為錯誤配對。", "安息香為香膠。"]},
{c:"樹脂與脂質",q:"下列何者不屬於樹脂及樹脂組合物（resins and resin combinations）？",o:["kava", "cannabis", "mastic", "fennel"],a:3,e:["卡法（kava）含 styrylpyrones，屬樹脂類藥材。", "大麻（cannabis）樹脂類。", "乳香（mastic）為凝固樹脂。", "小茴香主要含揮發油（anethole），不屬樹脂類，為正確答案。"]},
{c:"樹脂與脂質",q:"有關樹脂類特性之敘述，下列何者錯誤？",o:["化學性質複雜", "可能為 terpenes 的氧化產物", "可溶於水", "為無定形固體"],a:2,e:["樹脂化學性質複雜，為混合物。", "樹脂可能為萜類的氧化產物。", "樹脂不溶於水，可溶於酒精，為錯誤敘述。", "樹脂為無定形（amorphous）固體。"]},
{c:"樹脂與脂質",q:"松香（rosin）之主要成分為下列何者？",o:["abietic anhydride", "mastichic acid", "commiphoric acid", "cinnamic acid"],a:0,e:["松香含 80～90% abietic acid 的 anhydride，為三環雙萜類，作硬化劑。", "Mastichic acid 為乳香成分。", "Commiphoric acid 為沒藥成分。", "Cinnamic acid 為香膠類成分。"]},
{c:"樹脂與脂質",q:"北美聖草（Eriodictyon）之用途為何？",o:["掩飾 quinine 的苦味", "抗凝血", "局部麻醉", "抗瘧"],a:0,e:["北美聖草（Eriodictyon californicum）用於掩飾 quinine 苦味，並作刺激性祛痰劑。", "抗凝血為 dicumarol。", "局部麻醉為 cocaine。", "抗瘧為 quinine、artemisinin。"]},
{c:"樹脂與脂質",q:"下列何種藥用植物之根與根莖，其所含樹脂含有 styrylpyrones？",o:["cannabis", "eriodictyon", "kava", "mayapple"],a:2,e:["大麻（桑科）雌花含 THC，非 styrylpyrone。", "北美聖草為葉部，含黃酮。", "卡法（Piper methysticum，胡椒科）根與根莖含 styrylpyrones（如 dihydromethysticin），具肌肉鬆弛作用。", "Mayapple 含 podophyllotoxin（lignan）。"]},
{c:"樹脂與脂質",q:"Δ9-tetrahydrocannabinol 之化學結構具有下列何種官能基？",o:["酯基", "醚基", "酮基", "羧基"],a:1,e:["THC 不含酯基。", "THC 屬單萜類，含酚基與醚基（吡喃環）。", "THC 不含酮基。", "THC 不含羧基（大麻二醇酸才含羧基）。"]},
{c:"樹脂與脂質",q:"大麻（Cannabis sativa）之基源科別為何？",o:["桑科", "豆科", "胡椒科", "茄科"],a:0,e:["大麻屬桑科 Moraceae，雌株帶花的枝梢入藥。", "豆科為甘草、相思子等。", "胡椒科為卡法、胡椒。", "茄科為顛茄、曼陀羅。"]},
{c:"樹脂與脂質",q:"有關薑（ginger）的敘述，下列何者錯誤？",o:["取用薑科 Curcuma longa 之根莖", "zingiberene 為其香氣成分之一", "zingerone 為其辛辣成分之一", "為芳香刺激劑與驅風劑"],a:0,e:["薑為 Zingiber officinale 之根莖；Curcuma longa 是薑黃，不是薑，為錯誤敘述。", "薑的揮發油含 zingiberene（倍半萜），為香氣成分。", "Zingerone、shogaol 為辛辣成分（芳香酮）。", "薑作矯味、芳香刺激劑與驅風劑。"]},
{c:"樹脂與脂質",q:"沒藥（myrrh）之基源植物科別為何？",o:["芸香科", "木犀科", "橄欖科", "薑科"],a:2,e:["芸香科如黃柏、吳茱萸。", "木犀科如連翹。", "沒藥（Commiphora molmol）為橄欖科 Burseraceae，油膠樹脂，含 commiphoric acid。", "薑科如薑、薑黃。"]},
{c:"樹脂與脂質",q:"有關沒藥（myrrh）之敘述，下列何者錯誤？",o:["基源植物為 Commiphora molmol", "為橄欖科植物", "特有成分為 commiphoric acids", "為中國之特產"],a:3,e:["基源為 Commiphora molmol。", "屬橄欖科。", "Commiphoric acid 為其特有成分，防腐、健胃。", "沒藥主產於非洲、阿拉伯地區，並非中國特產，為錯誤敘述。"]},
{c:"樹脂與脂質",q:"秘魯香膠（Peru balsam）基源植物 Myroxylon pereirae 之科別為何？",o:["薔薇科", "豆科", "繖形科", "橄欖科"],a:1,e:["薔薇科如野櫻、杏。", "秘魯香膠與吐魯香膠皆來自豆科 Myroxylon 屬。", "繖形科如小茴香。", "橄欖科如沒藥。"]},
{c:"樹脂與脂質",q:"下列何種香膠具收斂作用，可治痔瘡？",o:["storax", "Peruvian balsam", "Tolu balsam", "benzoin"],a:1,e:["蘇合香（storax）作香料、祛痰。", "秘魯香膠含 benzyl cinnamate，局部保護、收斂，可治痔瘡、殺疥癬。", "吐魯香膠含 benzyl benzoate，祛痰、矯味。", "安息香為防腐、利尿、祛痰。"]},
{c:"樹脂與脂質",q:"蘇合香（storax）之基源植物科別為何？",o:["金縷梅科", "豆科", "芸香科", "樟科"],a:0,e:["蘇合香 Liquidambar orientalis（亞洲蘇合香）與 L. styraciflua（美洲蘇合香）為金縷梅科。", "豆科為秘魯、吐魯香膠。", "芸香科如黃柏、柑橘類。", "樟科如桂皮、樟腦。"]},
{c:"樹脂與脂質",q:"有關酸價、酯價、皂化價與碘價，下列何者正確？",o:["碘價可測定脂肪酸之不飽和度", "酸價是皂化 1 g 脂肪所需 KOH 之 mg 數", "皂化價測定游離脂肪酸含量", "酯價測定碘的含量"],a:0,e:["碘價為每 100 g 油脂吸收碘的克數，碘價越大，雙鍵越多，不飽和度越高。", "酸價是中和 1 g 游離脂肪酸所需 KOH 之 mg 數。", "皂化價為中和及皂化 1 g 油脂所需 KOH 之 mg 數。", "酯價為皂化 1 g 脂肪酯所需 KOH 之 mg 數，非測碘。"]},
{c:"樹脂與脂質",q:"下列何者為半乾性油的碘價範圍？",o:["100～120", "80～100", "120～140", "140～160"],a:0,e:["半乾性油（棉籽油、芝麻油）碘價 100～120。", "80～100 為不乾性油區間（碘價小於 100）。", "碘價大於 120 屬乾性油（亞麻仁油、魚肝油）。", "140 以上為高度不飽和的乾性油。"]},
{c:"樹脂與脂質",q:"為什麼在分析蜂蠟與白蠟品質時，酯價具有價值？",o:["可判斷是否摻雜 paraffin 等添加物", "可用於估算熔點", "可測定碘價", "可判斷是否酸敗"],a:0,e:["蜂蠟、白蠟的酯價可判斷是否摻雜 paraffin；paraffin 不含酯，使皂化價下降。", "熔點需直接測定。", "碘價需另外測定。", "判斷酸敗需看酸價。"]},
{c:"樹脂與脂質",q:"下列何者為單不飽和油（monounsaturated oil）？",o:["coconut oil", "palm kernel oil", "rapeseed oil（菜籽油）", "safflower oil"],a:2,e:["椰子油為飽和固定油。", "棕櫚仁油為飽和固定油。", "菜籽油（以及橄欖油、花生油、蓖麻油）屬單不飽和油。", "紅花籽油為多不飽和油。"]},
{c:"樹脂與脂質",q:"下列何種植物油之 linoleic acid 含量最多？",o:["safflower oil", "cottonseed oil", "peanut oil", "palm kernel oil"],a:0,e:["紅花籽油（及葵花籽油）linoleic acid 含量為最多。", "棉籽油含量較少。", "花生油為單不飽和油。", "棕櫚仁油為飽和油。"]},
{c:"樹脂與脂質",q:"下列何種油具有中鏈長之結構（C-8 或 C-10），可當灌食之營養補充劑？",o:["coconut oil", "theobroma oil", "sunflower oil", "safflower oil"],a:0,e:["椰子油為三酸甘油酯混合物，含中鏈（月桂酸、肉豆蔻酸）脂肪酸，可作腸道營養補充劑。", "可可脂為長鏈脂肪酸。", "葵花籽油為多不飽和長鏈脂肪酸。", "紅花籽油為多不飽和長鏈脂肪酸。"]},
{c:"樹脂與脂質",q:"固定油（fixed oil）與蠟（wax）在化學組成上之差異為何？",o:["固定油為甘油酯，蠟為高分子量醇與脂肪酸之酯", "兩者皆為甘油與脂肪酸之酯", "蠟含鹼性氮", "固定油為揮發油"],a:0,e:["固定油與脂肪為甘油＋脂肪酸（三酸甘油酯）；蠟為高分子量一元醇＋脂肪酸。", "只有固定油與脂肪為甘油酯。", "蠟與氮無關。", "固定油不揮發，與揮發油不同。"]},
{c:"樹脂與脂質",q:"固定油經氫化（hydrogenation）之目的為何？",o:["防止不飽和脂肪酸酸敗並使油變固體", "增加不飽和度", "增加碘價", "使油揮發"],a:0,e:["氫化是將雙鍵加氫，使不飽和脂肪酸飽和，防止酸敗並提高熔點，經冷卻過濾後得硬脂（stearins）。", "氫化是降低不飽和度。", "氫化使碘價降低。", "固定油為不揮發性油。"]},
{c:"樹脂與脂質",q:"有關蓖麻油（castor oil）之敘述，下列何者錯誤？",o:["來自 Ricinus communis 之種子", "具有瀉下的作用", "所含之 triacylglycerols 多為 triricinoleoylglycerol", "所含的 ricin 不具血球凝集作用"],a:3,e:["蓖麻油取自大戟科 Ricinus communis 的成熟種子。", "蓖麻油在十二指腸被胰脂酶水解，釋出 ricinoleic acid，具瀉下作用。", "蓖麻油約 85% 為 triricinoleoylglycerol。", "蓖麻子中的 ricin 為毒性蛋白質，具血球凝集作用，故此敘述錯誤。"]},
{c:"樹脂與脂質",q:"蓖麻油（castor oil）所含 triricinoleoylglycerol 在十二指腸被何者水解，釋出 ricinoleic acid？",o:["胰脂酶（pancreatic lipase）", "胃蛋白酶", "澱粉酶", "膽鹼酯酶"],a:0,e:["胰脂酶將三酸甘油酯水解成 ricinoleic acid，後者刺激腸道而瀉下。", "胃蛋白酶水解蛋白質。", "澱粉酶水解澱粉。", "膽鹼酯酶水解乙醯膽鹼。"]},
{c:"樹脂與脂質",q:"橄欖油（olive oil）製品中，何者具有最高酸價（acid value）？",o:["technical oil", "tournant oil", "virgin olive oil", "sulfur olive oil"],a:1,e:["Technical oil 為工業用，非最高酸價者。", "橄欖油製品中 tournant oil（由腐爛果實得到）具有最高酸價。", "Virgin olive oil 為初榨，酸價低。", "Sulfur olive oil 為以溶劑抽出的殘渣油，酸價不是最高。"]},
{c:"樹脂與脂質",q:"下列植物油何者取自果實之中果皮（mesocarp）？",o:["coconut oil", "castor oil", "palm oil", "cottonseed oil"],a:2,e:["椰子油取自核仁（kernel）。", "蓖麻油取自種子。", "棕櫚油取自果實之中果皮（棕櫚仁油才取自核仁）。", "棉籽油取自種子。"]},
{c:"樹脂與脂質",q:"下列植物油與其基源之配對，何者錯誤？",o:["sesame oil－Sesamum indicum（Pedaliaceae）", "safflower oil－Helianthus annuus（Asteraceae）", "cottonseed oil－Gossypium hirsutum（Malvaceae）", "almond oil－Prunus amygdalus（Rosaceae）"],a:1,e:["芝麻油來自胡麻科 Sesamum indicum。", "紅花籽油來自菊科 Carthamus tinctorius；Helianthus annuus 為葵花，為錯誤配對。", "棉籽油來自錦葵科 Gossypium hirsutum。", "杏仁油來自薔薇科 Prunus amygdalus。"]},
{c:"樹脂與脂質",q:"芝麻油中含有 sesamolin，可作為除蟲菊殺蟲劑的增效劑（synergist），其成分屬於何類？",o:["木脂素（lignan）", "黃酮", "生物鹼", "蒽醌"],a:0,e:["芝麻油含 sesamin、sesamolin 等木脂素，sesamolin 與 pyrethrum 合用可增加殺蟲效果；sesamol 可防止酸敗。", "黃酮不是芝麻油增效成分。", "芝麻油不含生物鹼。", "蒽醌與芝麻油無關。"]},
{c:"樹脂與脂質",q:"下列何種脂肪酸中，存在於海魚且具有抗血小板凝集作用？",o:["16：1（ω7）", "20：1（ω9）", "20：1（ω11）", "20：5（ω3）"],a:3,e:["16:1（ω7）不是抗血小板凝集的主要成分。", "20:1（ω9）不是抗血小板成分。", "20:1（ω11）不是抗血小板成分。", "20:5（ω3）即 EPA，存在於鱈魚肝油等海魚油中，具抗血小板凝集、降低心血管疾病風險的作用。"]},
{c:"樹脂與脂質",q:"可可脂（theobroma oil）之敘述，下列何者錯誤？",o:["基源植物之科名為 Sterculiaceae", "約於 20～25℃熔化", "可作為栓劑基質", "theobroma 源自希臘文，意為「神的食物」"],a:1,e:["可可樹（Theobroma cacao）為梧桐科 Sterculiaceae。", "可可脂的 β form 熔點約 34℃（α form 約 24℃），室溫為固體，故於 20～25℃熔化的說法錯誤。", "可可脂熔點接近體溫，可作栓劑基質。", "Theobroma 源自希臘文，意為神的食物。"]},
{c:"樹脂與脂質",q:"羊毛脂（lanolin）之敘述，下列何者正確？",o:["為 cholesterol、lanosterol 等醇類與脂肪酸形成之酯類，可吸收水分作軟膏基劑", "為植物性蠟", "含水量約 0.25%（含水羊毛脂）", "不會引起過敏"],a:0,e:["羊毛脂來自羊毛（Ovis aries），含 cholesterol、lanosterol 與脂肪酸酯，為吸收性軟膏基劑。", "羊毛脂為動物性蠟。", "含水羊毛脂含 25～30% 水；無水羊毛脂含水量才低於 0.25%。", "羊毛脂對高敏感使用者可能引起過敏。"]},
{c:"樹脂與脂質",q:"下列何種蠟（waxes）來自植物？",o:["carnauba wax", "lac wax", "white wax", "yellow wax"],a:0,e:["巴西棕櫚蠟（Copernicia prunifera 葉，棕櫚科）為植物性蠟。", "蟲膠蠟（lac wax）來自昆蟲。", "白蠟為黃蠟經陽光曝曬而得（動物性）。", "黃蠟（beeswax）來自蜜蜂。"]},
{c:"樹脂與脂質",q:"下列何者在化學分類上屬於液體蠟（liquid wax）？",o:["coconut oil", "olive oil", "jojoba oil", "linseed oil"],a:2,e:["椰子油為固定油。", "橄欖油為固定油。", "荷荷芭油（Simmondsia chinensis，黃楊科）為液態蠟，主要為蠟酯，非三酸甘油酯。", "亞麻仁油為固定油。"]},
{c:"樹脂與脂質",q:"黃蠟（yellow wax）精製成白蠟（white wax）所使用之方法之一為何？",o:["氫化", "加熱", "陽光曝曬", "水解"],a:2,e:["氫化用於油脂的硬化。", "加熱不能使蠟漂白。", "蜂蠟經陽光曝曬褪色，可形成白蠟。", "水解會破壞蠟酯，不用於漂白。"]},
{c:"生物鹼",q:"生藥藜蘆（Veratrum）藥效成分屬於何種生物鹼？",o:["steroidal alkaloid", "diterpenoid alkaloid", "piperidine alkaloid", "pyrrolidine alkaloid"],a:0,e:["綠藜蘆、白藜蘆的 protoveratrine 等屬固醇類生物鹼，降血壓。", "Diterpenoid alkaloid 如烏頭鹼。", "Piperidine alkaloid 如 lobeline。", "Pyrrolidine alkaloid 如 hygrine。"]},
{c:"生物鹼",q:"下列生藥與其基源植物所屬科別之配對，何者正確？",o:["belladonna－Solanaceae", "cinchona－Rutaceae", "nux vomica－Apocynaceae", "veratrum viride－Rubiaceae"],a:0,e:["顛茄為茄科。", "金雞納為茜草科 Rubiaceae。", "番木鱉為馬錢科 Loganiaceae。", "綠藜蘆為百合科 Liliaceae。"]},
{c:"生物鹼",q:"下列何者為固醇類生物鹼？",o:["cinchonidine", "caffeine", "protoveratrine A", "pilocarpine"],a:2,e:["Cinchonidine 為 quinoline 類。", "Caffeine 為 purine 類。", "Protoveratrine A 為藜蘆的七環固醇類酯型生物鹼。", "Pilocarpine 為 imidazole 類。"]},
{c:"生物鹼",q:"Protoveratrine B 與 protoveratrine A 在結構上有何差異？",o:["B 比 A 多一個 OH 基", "B 比 A 少一個 OH 基", "B 為 A 的光學異構物", "B 無酯基"],a:0,e:["Protoveratrine B 的酯側鏈含 methyldihydroxybutyric acid，比 A 的 methylhydroxybutyric acid 多一個 OH。", "不是少一個 OH。", "兩者非光學異構物。", "兩者皆具酯基（ester）。"]},
{c:"生物鹼",q:"下列有關麻黃（Ephedra）之敘述，何者正確？",o:["屬裸子植物，莖發汗、根止汗", "屬被子植物雙子葉", "主成分 ephedrine 為 indole 類", "全部位均發汗"],a:0,e:["麻黃屬裸子植物（麻黃科），草質莖發汗，根節止汗。", "麻黃為裸子植物，不是被子植物。", "Ephedrine 為非雜環的生物鹼胺（phenylalanine 前驅物），不是 indole 類。", "莖與根作用不同：莖發汗，根止汗。"]},
{c:"生物鹼",q:"麻黃鹼（ephedrine）的藥理作用為何？",o:["擬交感神經興奮，可平喘", "抗膽鹼，散瞳", "抑制 MAO", "阻斷神經肌肉"],a:0,e:["Ephedrine 為擬交感神經作用，活化 α、β1、β2，支氣管平滑肌鬆弛，治氣喘、枯草熱。", "抗膽鹼散瞳為 atropine。", "抑制 MAO 如 hypericin。", "神經肌肉阻斷如 tubocurarine。"]},
{c:"生物鹼",q:"秋水仙（Colchicum）所含 colchicine 之生合成前驅物為何？",o:["lysine、aspartic acid", "ornithine、mevalonic acid", "phenylalanine、tyrosine", "tryptophan、secologanin"],a:2,e:["Lysine、aspartic acid 為 piperidine、pyridine 類前驅物。", "Ornithine、mevalonic acid 不是 colchicine 前驅物。", "Colchicine 由 phenylalanine 與 tyrosine 衍生（苯環 A、tropolone 環 C），並含乙醯基。", "Tryptophan、secologanin 為 indole、quinoline 類前驅物。"]},
{c:"生物鹼",q:"下列何種生藥所含之主成分，屬於 alkaloidal amine 類？",o:["ergot", "green hellebore", "abyssinian tea（khat）", "nux vomica"],a:2,e:["麥角為 indole 類。", "綠藜蘆為固醇類生物鹼。", "阿比西尼亞茶（Catha edulis）含 cathinone，為 alkaloidal amine，似安非他命，咀嚼可減輕飢餓與疲勞。", "番木鱉為 indole 類（strychnine）。"]},
{c:"生物鹼",q:"下列生物鹼何者不屬於 alkaloidal amines？",o:["pilocarpine", "ephedrine", "colchicine", "cathinone"],a:0,e:["Pilocarpine 為 imidazole 類，N 在環上，屬雜環生物鹼，不是 alkaloidal amine。", "Ephedrine 為 alkaloidal amine。", "Colchicine 為 alkaloidal amine。", "Cathinone 為 alkaloidal amine。"]},
{c:"生物鹼",q:"可可豆經 curing 後由白色變為暗紅棕色，此顏色變化之前驅物質為何？",o:["epicatechin", "theobromine", "caffeine", "sesamol"],a:0,e:["可可豆 curing 時，多酚氧化酶（polyphenol oxidase）作用於 epicatechins，使豆子由白色變暗紅棕色。", "Theobromine 為生物鹼，不是色素前驅物。", "Caffeine 為生物鹼，不是色素前驅物。", "Sesamol 為芝麻成分，與可可無關。"]},
{c:"生物鹼",q:"下列含咖啡因之生藥與其基源植物科別之配對，何者正確？",o:["coffee－Rubiaceae", "paraguay tea－Sterculiaceae", "cola－Sapindaceae", "tea－Aquifoliaceae"],a:0,e:["咖啡（Coffea arabica）為茜草科 Rubiaceae。", "巴拉圭茶（Ilex paraguariensis）為冬青科 Aquifoliaceae。", "可樂果（Cola nitida）為梧桐科 Sterculiaceae；瓜拉那才是無患子科。", "茶（Camellia sinensis）為茶科 Theaceae。"]},
{c:"生物鹼",q:"經生合成研究證實，下列何者非 caffeine 所含氮原子之來源？",o:["aspartic acid", "glutamine", "glycine", "serine"],a:3,e:["Aspartic acid 提供 N1。", "Glutamine 提供 N3、N9。", "Glycine 提供 C4、C5、N7。", "Serine 提供的是單碳基團（甲基），不是氮原子來源。"]},
{c:"生物鹼",q:"下列生藥何者不富含 caffeine？",o:["coffee bean", "guarana", "maté", "tonka bean"],a:3,e:["咖啡豆含咖啡因。", "瓜拉那種子含咖啡因 2.5～5%。", "馬黛茶（Ilex paraguariensis）含咖啡因。", "香豆（tonka bean）含 coumarin，不含咖啡因，為正確答案。"]},
{c:"生物鹼",q:"下列何者不屬於含氮雜環結構型的化合物？",o:["cathinone", "nicotine", "atropine", "quinine"],a:0,e:["Cathinone N 在側鏈，為 alkaloidal amine，非雜環。", "Nicotine 含 pyridine、pyrrolidine。", "Atropine 含 tropane 雙環。", "Quinine 含 quinoline 環。"]},
{c:"生物鹼",q:"下列何者屬於 non-heterocyclic alkaloid（非雜環生物鹼）？",o:["mescaline", "pilocarpine", "quinine", "berberine"],a:0,e:["墨西哥鹼（mescaline，仙人掌 Peyote）為 3,4,5-三甲氧基-β-苯乙胺，N 在側鏈，屬 alkaloidal amine。", "Pilocarpine 為 imidazole 雜環。", "Quinine 為 quinoline 雜環。", "Berberine 為 isoquinoline 雜環。"]},
{c:"總論與鑑定",q:"Atropine（阿托品）之命名係衍自於下列何者？",o:["生理活性", "發現者之姓名", "植物屬名", "植物種名"],a:2,e:["Emetine（吐根鹼）、morphine（嗎啡）才是依生理活性命名。", "Pelletierine（石榴皮鹼）才是依發現者姓名命名。", "Atropine 來自顛茄屬名 Atropa（Atropa belladonna），與 hydrastine、strychnine 同為依屬名命名。", "依種名命名者如 cocaine（Erythroxylon coca）、belladonnine。"]},
{c:"總論與鑑定",q:"Emetine（吐根鹼）係依據下列何者命名？",o:["生理活性（催吐）", "發現者姓名", "植物屬名", "植物種名"],a:0,e:["Emetine 因吐根具催吐（嘔吐）作用而得名；morphine 取自睡夢之神 Morpheus，亦屬此類。", "發現者命名如 pelletierine。", "屬名命名如 atropine、hydrastine。", "種名命名如 cocaine、belladonnine。"]},
{c:"總論與鑑定",q:"Cocaine（古柯鹼）之命名係依據下列何者？",o:["生理活性", "植物種名（Erythroxylon coca）", "發現者之姓名", "俗名"],a:1,e:["依生理活性命名者如 emetine、morphine。", "Cocaine 取自種名 coca（Erythroxylon coca），belladonnine 亦同。", "發現者命名如 pelletierine。", "俗名命名如 ergotamine（麥角）。"]},
{c:"總論與鑑定",q:"Ergotamine（麥角胺鹼）之命名係依據下列何者？",o:["植物屬名", "發現者姓名", "俗名（麥角 ergot）", "生理活性"],a:2,e:["屬名命名如 atropine。", "發現者命名如 pelletierine。", "Ergotamine、ergonovine 由麥角（ergot）之俗名命名。", "生理活性命名如 emetine。"]},
{c:"總論與鑑定",q:"生物鹼之命名字尾通常為「-ine」，下列何者為例外？",o:["camptothecin（喜樹鹼）", "nicotine", "atropine", "quinine"],a:0,e:["喜樹鹼 camptothecin 字尾為 -in，是例外；配醣體字尾才為 -in 或 -oside。", "Nicotine 字尾為 -ine。", "Atropine 字尾為 -ine。", "Quinine 字尾為 -ine。"]},
{c:"總論與鑑定",q:"下列科名同義詞之配對，何者錯誤？",o:["Compositae＝Asteraceae（菊科）", "Gramineae＝Poaceae（禾本科）", "Leguminosae＝Fabaceae（豆科）", "Cruciferae＝Apiaceae（十字花科）"],a:3,e:["菊科 Compositae 即 Asteraceae。", "禾本科 Gramineae 即 Poaceae。", "豆科 Leguminosae 即 Fabaceae。", "十字花科 Cruciferae 即 Brassicaceae；Apiaceae 為繖形科（Umbelliferae），為錯誤配對。"]},
{c:"總論與鑑定",q:"下列藥用部位拉丁名與中文之配對，何者錯誤？",o:["Cortex－皮", "Folium－葉", "Herba－全草", "Bulbus－球莖"],a:3,e:["Cortex 為皮。", "Folium 為葉。", "Herba 為全草。", "Bulbus 為鱗莖；球莖為 Tuber，為錯誤配對。"]},
{c:"總論與鑑定",q:"Claviceps purpurea 中得到單一高產率之 ergotamine，主要與影響次級代謝物的何種因素有關？",o:["遺傳（基因構成）", "個體發育階段", "環境", "栽培方法"],a:0,e:["遺傳構成可造成成分「量」與「質」的改變，例如麥角菌選育出單一高產率 ergotamine 的品系。", "個體發育影響不同時期含量，如罌粟 morphine。", "環境主要影響定量（如土壤、氣候）。", "栽培方法屬環境因素。"]},
{c:"總論與鑑定",q:"下列何者為植物之初級代謝物？",o:["alkaloid", "fatty acid", "glycoside", "tannin"],a:1,e:["生物鹼為次級代謝物。", "脂肪酸（與糖類、胺基酸、核酸）屬維持生存必需的初級代謝物。", "配醣體為次級代謝物。", "鞣質為次級代謝物。"]},
{c:"總論與鑑定",q:"下列何者非植物生藥所稱之「無效成分」（inert constituents）？",o:["cellulose", "lignin", "suberin", "alkaloid"],a:3,e:["纖維素為無效成分。", "木質素為無效成分。", "栓質為無效成分。", "生物鹼為有效成分（次級代謝物），為正確答案。"]},
{c:"總論與鑑定",q:"以 phloroglucinol＋HCl 試劑檢查生藥組織，可使何種組織呈粉紅色？",o:["木質化組織（韌皮纖維、石細胞、導管）", "木栓化組織", "草酸鈣結晶", "澱粉粒"],a:0,e:["間苯三酚＋鹽酸使木質化組織（韌皮、石細胞、導管）呈粉紅色。", "木栓化組織用 Sudan III，呈紅色。", "草酸鈣可用 chloral hydrate 透明後觀察。", "澱粉粒遇碘呈藍色。"]},
{c:"總論與鑑定",q:"Sudan III 試劑用於檢查生藥中下列何者？",o:["木栓化組織、揮發油、脂肪油（呈紅色）", "木質化組織", "草酸鈣", "澱粉"],a:0,e:["Sudan III 使木栓化組織、揮發油與脂肪油呈紅色。", "木質化組織用 phloroglucinol＋HCl。", "草酸鈣以 chloral hydrate 透明後觀察。", "澱粉用碘試液。"]},
{c:"總論與鑑定",q:"水合三氯乙醛（chloral hydrate）在生藥組織鑑定中的用途為何？",o:["透明組織，便於觀察草酸鈣、表皮組織與毛茸", "使木質化組織呈粉紅色", "使脂肪呈紅色", "固定組織"],a:0,e:["Chloral hydrate 為組織清除劑，可溶解澱粉、蛋白、葉綠素、樹脂，利於觀察草酸鈣、葉表皮與毛茸。", "木質化組織用 phloroglucinol＋HCl。", "脂肪用 Sudan III。", "封鎖劑為甘油水。"]},
{c:"總論與鑑定",q:"下列何者非生物鹼之檢測試劑？",o:["Mayer 試劑", "Wagner 試劑", "Dragendorff 試劑", "Liebermann-Burchard 試劑"],a:3,e:["Mayer 為碘化汞鉀，生物鹼試劑。", "Wagner 為碘＋碘化鉀，生物鹼試劑。", "Dragendorff 為碘化鉍鉀，生物鹼試劑。", "Liebermann-Burchard 用於檢測固醇類（steroid），不是生物鹼試劑，為正確答案。"]},
{c:"總論與鑑定",q:"Wagner 試劑與生物鹼產生何種顏色沉澱？",o:["褐／紅棕色", "淡黃色", "橘紅色", "白色"],a:0,e:["Wagner（I₂＋KI）產生褐／紅棕色沉澱。", "Mayer（碘化汞鉀）產生淡黃色沉澱。", "Dragendorff（碘化鉍鉀）產生橘紅色沉澱。", "Valser（碘化鉀＋碘化汞）產生白色沉澱。"]},
{c:"總論與鑑定",q:"Hager 試劑的成分為何？",o:["picric acid（苦味酸）", "碘化鉍鉀", "碘＋碘化鉀", "碘化汞鉀"],a:0,e:["Hager 試劑為苦味酸，與生物鹼產生黃色沉澱。", "碘化鉍鉀為 Dragendorff。", "碘＋碘化鉀為 Wagner。", "碘化汞鉀為 Mayer。"]},
{c:"總論與鑑定",q:"下列何者不是生物鹼在植物體內之功能？",o:["抵抗昆蟲與草食動物侵襲", "解毒的最終產物", "調節生長因子", "儲存能量"],a:3,e:["生物鹼為防禦昆蟲及草食動物的有毒物質。", "生物鹼為代謝解毒的最終產物。", "可作為調節生長因子。", "生物鹼可儲存氮素（N），但不是儲存能量，為正確答案。"]},
{c:"總論與鑑定",q:"下列何種生物鹼為黃色（為一般白色生物鹼之例外）？",o:["berberine（小蘗鹼）", "morphine", "atropine", "quinine"],a:0,e:["小蘗鹼 berberine 呈黃色；血根鹼硝酸鹽 sanguinarine 呈紅色。", "Morphine 為白色。", "Atropine 為白色。", "Quinine 為白色。"]},
{c:"總論與鑑定",q:"下列科別植物，何者不富含生物鹼？",o:["Labiatae（唇形科）", "Solanaceae（茄科）", "Rubiaceae（茜草科）", "Ranunculaceae（毛茛科）"],a:0,e:["唇形科、薔薇科幾乎不含生物鹼（益母草為例外）。", "茄科含 hyoscyamine 等。", "茜草科含 quinine、emetine。", "毛茛科含 aconitine、berberine。"]},
{c:"總論與鑑定",q:"除真菌類 Claviceps purpurea 外，ergot alkaloids 亦發現於下列何科高等植物中？",o:["Convolvulaceae（旋花科）", "Liliaceae", "Papaveraceae", "Solanaceae"],a:0,e:["旋花科（Ipomoea、幻河藤 Ololiuqui 種子）亦含麥角生物鹼。", "百合科如秋水仙。", "罌粟科如罌粟。", "茄科如顛茄。"]},
{c:"生合成",q:"下列前驅物與生物鹼類型之配對，何者錯誤？",o:["Lysine－piperidine 類", "Ornithine－tropane 類", "Tyrosine－isoquinoline 類", "Histidine－indole 類"],a:3,e:["Lysine 為 piperidine 類前驅物。", "Ornithine 為 tropane 類（hyoscyamine、cocaine）、nicotine 的 pyrrolidine 環前驅物。", "Tyrosine 為 isoquinoline 類（morphine、berberine）前驅物。", "Histidine 為 imidazole 類（pilocarpine）前驅物；indole 類為 tryptophan，為錯誤配對。"]},
{c:"生合成",q:"莽草酸（shikimic acid）途徑中，何者為分支點的中間產物？",o:["chorismic acid（分支酸）", "prephenic acid", "anthranilic acid", "cinnamic acid"],a:0,e:["分支酸為芳香族胺基酸（Phe、Tyr、Trp）的分支點。", "預苯酸為朝 Phe、Tyr 的分支。", "鄰胺基苯甲酸為朝 Trp 的分支。", "桂皮酸為 Phe 脫胺後的苯丙烷前驅物。"]},
{c:"生合成",q:"下列何者經 acetate-mevalonate pathway 生合成？",o:["steroid、terpenoid", "anthraquinone", "fatty acid", "alkaloid"],a:0,e:["固醇類、萜類由 acetyl-CoA 經 mevalonate、isoprene（及 squalene）而成。", "蒽醌經 acetate-malonate pathway。", "脂肪酸經 acetate-malonate pathway。", "生物鹼多由胺基酸而來。"]},
{c:"生物鹼",q:"下列何者為 lysine 衍生之生物鹼？",o:["arecoline", "hyoscyamine", "cocaine", "nicotine 的 pyrrolidine 環"],a:0,e:["Arecoline、pelletierine、lobeline 等 piperidine 類由 lysine 而來。", "Hyoscyamine 的 tropane 由 ornithine（pyrrolidine）＋acetate 而來。", "Cocaine 屬 tropane 類，來自 ornithine。", "Nicotine 的 pyrrolidine 環來自 ornithine。"]},
{c:"生物鹼",q:"由古柯葉製備古柯糊（coca paste）之過程，下列步驟何者錯誤？",o:["乾燥之古柯碎葉與水及石灰混合", "需加入煤油並攪拌", "過程需經酸液處理", "最後步驟需將抽提液中和至 pH 7"],a:3,e:["古柯葉先與水、石灰（鹼化）混合，使生物鹼游離。", "加入煤油（kerosene）並攪拌，萃取生物鹼。", "油層加酸水，生物鹼成鹽類轉入水層。", "最後加氨水或小蘇打使溶液呈鹼性才使生物鹼沉澱，不是中和到 pH 7，為錯誤步驟。"]},
{c:"生物鹼",q:"Brompton cocktail 用於癌末止痛，其主要成分為何？",o:["cocaine HCl＋morphine", "atropine＋morphine", "codeine＋caffeine", "ephedrine＋caffeine"],a:0,e:["布頓氏雞尾酒療法含鹽酸古柯鹼與嗎啡，用於癌症末期止痛。", "Atropine 與 morphine 不是此處組合。", "Codeine＋caffeine 不是 Brompton。", "Ephedrine＋caffeine 為減肥類組合，與其無關。"]},
{c:"生物鹼",q:"快克（crack）之製備與特性，下列何者正確？",o:["鹽酸古柯鹼＋氨水或碳酸氫鈉水溶液，游離後加熱再冷卻成石塊狀結晶", "古柯葉直接乾燥", "由嗎啡乙醯化而成", "為 codeine 衍生物"],a:0,e:["Crack 由鹽酸古柯鹼加鹼成游離鹼，加熱、冷卻後成卵石狀結晶，吸食時會產生聲響，二級管制。", "不是古柯葉直接乾燥。", "乙醯化嗎啡得 heroin。", "Crack 為古柯鹼，與 codeine 無關。"]},
{c:"生物鹼",q:"阿片酊（laudanum，opium tincture）之藥理用途為何？",o:["止瀉（抑制腸蠕動）", "發汗", "祛痰", "降血壓"],a:0,e:["阿片酊含嗎啡，用於抑制腸蠕動、止瀉；阿片樟腦酊（paregoric）亦止瀉。", "發汗為 Dover's powder。", "祛痰如吐根。", "降血壓如 reserpine。"]},
{c:"生物鹼",q:"俗稱 Dover's powder 係由那兩種生藥組成？",o:["ipecac、opium", "coca、ipecac", "hyoscyamus、pilocarpus", "cinchona、coca"],a:0,e:["Dover's powder 由吐根（ipecac）與阿片（opium）組成，嗎啡約 11%，作發汗劑。", "Coca＋ipecac 不是此處組成。", "Hyoscyamus＋pilocarpus 為作用相反的組合。", "Cinchona＋coca 不是此處組成。"]},
{c:"生物鹼",q:"Theophylline 之基本化學結構中，N1、N3、N7 之取代基為何？",o:["N1、N3 為甲基，N7 為 H", "N1、N3、N7 皆為甲基", "N3、N7 為甲基，N1 為 H", "N1 為甲基，N3、N7 為 H"],a:0,e:["茶鹼為 1,3-dimethylxanthine，N1、N3 為甲基，N7 為 H。", "三個甲基為 caffeine（1,3,7-trimethylxanthine）。", "3,7-二甲基為 theobromine（可可鹼）。", "僅 N1 甲基不是天然甲基黃嘌呤型。"]},
{c:"生物鹼",q:"Murexide test 可用於檢測下列何類化合物？",o:["purine（如 caffeine）", "alkaloidal amine", "isoquinoline", "tropane"],a:0,e:["Murexide test 用於檢驗 purine 類（咖啡因、茶鹼等）。", "Alkaloidal amine 不用此試驗。", "Isoquinoline 不用 murexide test。", "Tropane 用 Vitali-Morin test。"]},
{c:"生物鹼",q:"甲基黃嘌呤類（methylxanthines）之藥理作用機轉為何？",o:["抑制 phosphodiesterase，使 cAMP 增加", "抑制 acetylcholinesterase", "阻斷 muscarinic 受體", "抑制 Na⁺,K⁺-ATPase"],a:0,e:["甲基黃嘌呤抑制 PDE，使 cAMP 增加，造成平滑肌鬆弛、支氣管擴張、中樞興奮、利尿。", "抑制 AChE 如 physostigmine。", "阻斷 muscarinic 如 atropine。", "抑制 Na⁺,K⁺-ATPase 如強心苷。"]},
{c:"配醣體",q:"有關皂素（saponins）之敘述，下列何者錯誤？",o:["具有清潔劑特性", "有溶血作用", "在水中會形成膠體溶液", "sapogenins 之乙醯化產物通常較不具結晶性"],a:3,e:["皂素振搖產生泡沫，降低表面張力，具清潔劑特性。", "皂素破壞紅血球，具溶血作用。", "皂素在水中形成膠體溶液。", "皂苷元乙醯化通常形成結晶性化合物，可利於純化，故此敘述錯誤。"]},
{c:"總論與鑑定",q:"最早使用「生藥學（Pharmacognosis）」這個專有名詞的學者為何？",o:["J.A. Schmidt", "Dioscorides", "Seydler", "Tyler"],a:0,e:["J.A. Schmidt 為最早使用 Pharmacognosis 專有名詞的學者。", "Dioscorides 為希臘人，著有 De Materia Medica，載 600 種藥用植物。", "Seydler 為創詞者，由 Pharmakon（藥物）＋gnosis（知識）組成。", "Tyler 的生藥學著作採用化學成分分類法編寫。"]},
{c:"總論與鑑定",q:"「生藥學」一詞之字源 Pharmakon 與 gnosis 之意義分別為何？",o:["藥物；知識", "天然物；生物", "藥劑；技術", "生藥；植物"],a:0,e:["Pharmakon 為藥物，gnosis 為知識，故生藥學意指藥物的知識。", "天然物與生物不是字源意義。", "不是藥劑與技術。", "不是生藥與植物。"]},
{c:"總論與鑑定",q:"著作 De Materia Medica（藥物學）共五卷，記載約 600 種藥用植物，其作者為何？",o:["Dioscorides", "Seydler", "Tyler", "李時珍"],a:0,e:["Dioscorides 為希臘人植物學家，著有 De Materia Medica Libri Cinque。", "Seydler 為創詞者。", "Tyler 為採化學成分分類編寫生藥學的學者。", "李時珍為《本草綱目》作者。"]},
{c:"總論與鑑定",q:"下列有關李時珍《本草綱目》之敘述，何者正確？",o:["收載 1892 種藥，以《政和本草》為藍本", "為印度臨床醫學基礎", "為希臘人所著", "收載 600 種藥用植物"],a:0,e:["《本草綱目》收載 1892 種藥，為我國 16 世紀以前醫藥成就的大總結。", "印度臨床醫學基礎為阿育吠陀（Ayurveda）。", "希臘人著作為 De Materia Medica。", "600 種為 Dioscorides 著作的藥用植物數。"]},
{c:"總論與鑑定",q:"印度阿育吠陀（Ayurveda）之字源為何？",o:["Ayur（生命）＋Veda（知識）", "Ayur（藥物）＋Veda（植物）", "Ayur（醫師）＋Veda（疾病）", "Ayur（草藥）＋Veda（毒）"],a:0,e:["Ayurveda 為印度臨床醫學的基礎系統，意為生命知識。", "不是藥物與植物。", "不是醫師與疾病。", "不是草藥與毒。"]},
{c:"總論與鑑定",q:"Tyler 所著之生藥學，採用下列何種分類法編寫？",o:["化學成分分類法", "字母順序分類法", "藥理作用分類法", "基源植物分類法"],a:0,e:["Tyler 的生藥學採用化學成分分類法。", "字母排序法為早期簡易分類。", "藥理作用分類法為另一種分類。", "基源植物分類法為另一種分類。"]},
{c:"總論與鑑定",q:"Glycosyl transferase 催化醣苷形成時，醣基供應者為何？",o:["UDP-sugar", "sugar-1-phosphate", "sugar-6-phosphate", "free sugar"],a:0,e:["配醣體生合成由 glycosyl transferase 將 UDP-sugar 之醣基轉移到苷元（aglycone）。", "Sugar-1-phosphate 是 UDP-sugar 形成的前驅物。", "Sugar-6-phosphate 為糖解中間體。", "游離醣不能直接作供體。"]},
{c:"總論與鑑定",q:"Phloridzin（根皮苷）之苷元屬於下列何種骨架？",o:["dihydrochalcone", "anthraquinone", "stilbene", "lignan"],a:0,e:["Phloridzin 的苷元 phloretin 為 dihydrochalcone。", "Anthraquinone 為蒽醌類。", "Stilbene 為二苯乙烯類。", "Lignan 為木酚素類。"]},
{c:"總論與鑑定",q:"前列腺素（prostaglandins）係由幾個碳之脂質代謝物形成？",o:["20", "18", "19", "21"],a:0,e:["前列腺素為含 20 個碳的脂肪酸（花生四烯酸）衍生物。", "18 碳為油酸、亞麻油酸等。", "19 碳不是前列腺素的碳數。", "21 碳不是前列腺素的碳數。"]},
{c:"總論與鑑定",q:"下列何者以「樹皮」作為主要藥用部位？",o:["金雞納（Cinchona）", "吐根（Ipecac）", "毒扁豆（Physostigma）", "古柯（Coca）"],a:0,e:["金雞納以根皮與莖皮入藥（另有喜樹皮、石榴皮、黃柏皮）。", "吐根用根及根莖。", "毒扁豆用種子。", "古柯用葉。"]},
{c:"總論與鑑定",q:"下列生藥何者之藥用部位不是種子？",o:["nux vomica", "physostigma", "areca", "coca"],a:3,e:["番木鱉用種子。", "毒扁豆用種子。", "檳榔用成熟種子。", "古柯用葉，不是種子，為正確答案。"]},

const L={all:'全部',生合成:'生合成',生物鹼:'生物鹼',配醣體:'配醣體',萜類與揮發油:'萜類與揮發油',樹脂與脂質:'樹脂與脂質',多醣類:'多醣類',苯丙烷與木酚素:'苯丙烷與木酚素',類黃酮與鞣質:'類黃酮與鞣質',總論與鑑定:'總論與鑑定',wrong:'錯題練習'};
const ld=()=>{try{return JSON.parse(localStorage.getItem('pq3'))||{wrong:[],hist:[]}}catch(e){return{wrong:[],hist:[]}}};
const sv=d=>{try{localStorage.setItem('pq3',JSON.stringify(d))}catch(e){}};
let D=ld(),S=null;
const $=id=>document.getElementById(id),A=$('app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function tab(t){['quiz','wrong','hist'].forEach(k=>$('t-'+k).className=k==t?'on':'');({quiz:home,wrong:wrongV,hist:histV})[t]()}
function opts(q,order,pick,show){return order.map((k,p)=>{const c=show?(k==q.a?'ok':(k==pick?'bad':'')):'';return `<div class="o ${c}" ${show?'':`onclick="choose(${k})" style="cursor:pointer"`}><b>${'ABCD'[p]}</b>${q.o[k]}${show?`<div class="x">${k==q.a?'✔ 正確：':'✘ 錯誤：'}${q.e[k]}</div>`:''}</div>`}).join('')}
function home(){S=null;const n=s=>Q.filter(q=>s=='all'||q.c==s).length;
A.innerHTML=`<h2>選擇範圍</h2><p class="mu">題庫尚有 ${(()=>{const sn=new Set(D.seen||[]);D.hist.forEach(h=>h.ids.forEach(x=>sn.add(x)));return Q.length-sn.size})()} 題沒做過</p><div class="card"><p class="mu">生藥學題庫，內容出自你提供的筆記與講義，題型參考藥師國考。每次從所選範圍隨機抽 15 題，優先抽還沒做過的題（不足 15 題則補抽做過的）。每題作答後，會顯示四個選項各自的詳解。答錯的題目自動收進錯題本，每次測驗都會留下紀錄。</p>
<button class="btn" onclick="start('all')">全部題目（${n('all')} 題）</button><button class="btn g" onclick="start('生合成')">生合成（${n('生合成')} 題）</button><button class="btn g" onclick="start('生物鹼')">生物鹼（${n('生物鹼')} 題）</button><button class="btn g" onclick="start('配醣體')">配醣體（${n('配醣體')} 題）</button><button class="btn g" onclick="start('萜類與揮發油')">萜類與揮發油（${n('萜類與揮發油')} 題）</button><button class="btn g" onclick="start('樹脂與脂質')">樹脂與脂質（${n('樹脂與脂質')} 題）</button><button class="btn g" onclick="start('多醣類')">多醣類（${n('多醣類')} 題）</button><button class="btn g" onclick="start('苯丙烷與木酚素')">苯丙烷與木酚素（${n('苯丙烷與木酚素')} 題）</button><button class="btn g" onclick="start('類黃酮與鞣質')">類黃酮與鞣質（${n('類黃酮與鞣質')} 題）</button><button class="btn g" onclick="start('總論與鑑定')">總論與鑑定（${n('總論與鑑定')} 題）</button>
<button class="btn g" onclick="start('wrong')">練習錯題本（${D.wrong.length} 題）</button></div>`}
function start(m){let ids=Q.map((q,i)=>i).filter(i=>m=='all'||m=='wrong'?(m=='all'||D.wrong.includes(i)):Q[i].c==m);
if(!ids.length){alert('目前沒有題目可練習');return}const sn=new Set(D.seen||[]);D.hist.forEach(h=>h.ids.forEach(x=>sn.add(x)));const un=sh(ids.filter(x=>!sn.has(x))),sd=sh(ids.filter(x=>sn.has(x)));S={m,ids:sh(un.concat(sd).slice(0,15)),i:0,ans:[],pick:null};nq()}
function nq(){S.order=sh([0,1,2,3]);S.pick=null;rq()}
function rq(){const id=S.ids[S.i],q=Q[id],sh_=S.pick!==null;
A.innerHTML=`<div class="tag">${L[S.m]}｜第 ${S.i+1} / ${S.ids.length} 題｜${q.c}</div><div class="card"><h2>${q.q}</h2>${opts(q,S.order,S.pick,sh_)}</div>`+(sh_?`<button class="btn" onclick="nxt()">${S.i+1<S.ids.length?'下一題':'完成測驗，看結果'}</button>`:'<p class="mu">點選一個答案</p>')}
function choose(k){if(S.pick!==null)return;S.pick=k;rq()}
function nxt(){S.ans.push(S.pick);S.i++;S.i<S.ids.length?nq():fin()}
function fin(){let ok=0;S.ids.forEach((id,j)=>{const r=S.ans[j]==Q[id].a;r?ok++:(D.wrong.includes(id)||D.wrong.push(id));if(r&&S.m=='wrong')D.wrong=D.wrong.filter(x=>x!=id)});
D.seen=Array.from(new Set((D.seen||[]).concat(S.ids)));D.hist.unshift({t:Date.now(),m:S.m,ids:S.ids,p:S.ans,ok});D.hist=D.hist.slice(0,50);sv(D);
A.innerHTML=`<div class="card"><h2>測驗完成</h2><p style="font-size:28px;margin:4px 0">${ok} / ${S.ids.length}</p><p class="mu">答對率 ${Math.round(ok/S.ids.length*100)}%。答錯的題目已加入錯題本；在「練習錯題」中答對的題目會自動移出。</p><button class="btn" onclick="tab('hist')">查看歷史紀錄</button><button class="btn g" onclick="tab('wrong')">前往錯題本</button><button class="btn g" onclick="tab('quiz')">再測一次</button></div>`}
function detail(id,pick){const q=Q[id];return `<details><summary>${q.q}</summary>${opts(q,[0,1,2,3],pick,true)}</details>`}
function wrongV(){A.innerHTML=`<h2>錯題本（${D.wrong.length} 題）</h2>`+(D.wrong.length?`<button class="btn" onclick="start('wrong')">練習錯題</button>`+D.wrong.map(id=>`<div class="card"><span class="tag">${Q[id].c}</span>${detail(id,-1)}<button class="btn g" onclick="rm(${id})">已熟悉，移出錯題本</button></div>`).join('')+`<button class="btn g" onclick="if(confirm('確定清空錯題本？')){D.wrong=[];sv(D);wrongV()}">清空錯題本</button>`:'<div class="card mu">目前沒有錯題，繼續保持！</div>')}
function rm(id){D.wrong=D.wrong.filter(x=>x!=id);sv(D);wrongV()}
function histV(){A.innerHTML=`<h2>歷史紀錄</h2>`+(D.hist.length?D.hist.map((h,i)=>{const d=new Date(h.t);return `<div class="card"><b>${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</b>　${L[h.m]}　<b>${h.ok} / ${h.ids.length}</b>
<details><summary class="mu">查看每題作答</summary>${h.ids.map((id,j)=>`<div>${h.p[j]==Q[id].a?'<span class="g2">✔</span>':'<span class="r2">✘</span>'}${detail(id,h.p[j])}</div>`).join('')}</details></div>`}).join('')+`<button class="btn g" onclick="if(confirm('確定清除所有紀錄？')){D.hist=[];sv(D);histV()}">清除紀錄</button>`:'<div class="card mu">還沒有測驗紀錄。</div>')}
tab('quiz');
</script></body></html>
